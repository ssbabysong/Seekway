<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seekway">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#cfdcec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2537" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seekway</title>
<style>
/* Layout: a landscape with a winding path across the top (sky follows the time of day), then one white sheet of clearly spaced sections. Type scale: 20 / 17 / 15 / 13. */
:root {
  --bg: #ffffff;
  --ink: #22262c;
  --ink-2: #4b525c;
  --muted: #8a919c;
  --faint: #b8bec7;
  --line: #eceef1;
  --fill: #f4f5f7;
  --accent: #4f7a5f;
  --accent-soft: #e8f0ea;
  --warm: #9a7444;
  --warm-soft: #f3ede3;
  --cool: #5f7890;
  --cool-soft: #e8eef4;
  --rose: #b46a78;
  --rose-soft: #f6eaed;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181b; --ink: #eceef0; --ink-2: #c3c8ce; --muted: #8c939c; --faint: #5a616a; --line: #26292e; --fill: #1f2226;
    --accent: #8fbf9d; --accent-soft: #20302a; --warm: #d8b07a; --warm-soft: #33291c; --cool: #9db6cc; --cool-soft: #1f2a35;
    --rose: #e29aa8; --rose-soft: #3a252a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181b; --ink: #eceef0; --ink-2: #c3c8ce; --muted: #8c939c; --faint: #5a616a; --line: #26292e; --fill: #1f2226;
  --accent: #8fbf9d; --accent-soft: #20302a; --warm: #d8b07a; --warm-soft: #33291c; --cool: #9db6cc; --cool-soft: #1f2a35;
  --rose: #e29aa8; --rose-soft: #3a252a; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* landscape */
.hero { position: relative; height: 200px; overflow: hidden; }
.hero svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero[data-sky="day"]   { --s1: #cfdcec; --s2: #f3ece3; --sun: #fbe3c8; --h0: #c9d4e0; --h1: #b9c9d8; --h2: #9fb7a6; --h3: #86a58f; --path: #f6f1e8; --star: transparent; }
.hero[data-sky="dawn"]  { --s1: #dbe3f0; --s2: #fbe6d6; --sun: #ffd9b8; --h0: #ccd3e2; --h1: #bcc8d9; --h2: #a3b9aa; --h3: #8aa793; --path: #fbf3ea; --star: transparent; }
.hero[data-sky="dusk"]  { --s1: #d4cbe5; --s2: #f8d9c7; --sun: #ffcfac; --h0: #c4bdd4; --h1: #b3afc8; --h2: #98a5a6; --h3: #7d9286; --path: #fbeee2; --star: transparent; }
.hero[data-sky="night"] { --s1: #1c2537; --s2: #39405a; --sun: #ebe6d2; --h0: #2f3850; --h1: #3a4560; --h2: #33475a; --h3: #2b3f48; --path: #c3cad8; --star: #e9ecf5; }
.hero .steps { position: absolute; left: 20px; top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 13px; color: rgba(34, 38, 44, .62); }
.hero[data-sky="night"] .steps { color: rgba(236, 240, 248, .7); }

/* sheet */
.sheet { position: relative; margin-top: -26px; background: var(--bg); border-radius: 26px 26px 0 0; padding: 26px 20px 0; }
.kicker { font-size: 13px; color: var(--muted); }
h1 { font-size: 20px; font-weight: 600; line-height: 1.5; margin: 4px 0 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; line-height: 1.5; margin: 0; }
.section { padding: 26px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.section.first { border-top: 0; padding-top: 0; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
.text { margin: 0; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.quote { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--fill); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }

/* inputs */
textarea.write { display: block; width: 100%; border: 0; border-radius: 14px; background: var(--fill); color: var(--ink); font: inherit; font-size: 15px; line-height: 1.8; padding: 12px 14px; resize: none; min-height: 112px; overflow: hidden; }
textarea.write.short { min-height: 76px; }
input.field { width: 100%; min-width: 0; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font: inherit; font-size: 15px; padding: 10px 14px; }
select.field { appearance: none; -webkit-appearance: none; width: auto; cursor: pointer; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
textarea.write:focus, input.field:focus, select.field:focus { outline: 2px solid var(--accent-soft); }
textarea::placeholder, input::placeholder { color: var(--faint); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row > input.field { flex: 1 1 160px; }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-size: 15px; font-weight: 500; cursor: pointer; background: var(--fill); color: var(--ink); transition: transform .12s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--bg); }
.btn.block { width: 100%; padding: 13px; }
.btn.link { background: none; padding: 4px 0; color: var(--accent); font-size: 14px; font-weight: 500; }
.btn.link.muted { color: var(--muted); }
.btn.link.danger { color: var(--rose); }
.btn[disabled] { opacity: .45; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"][data-kind="up"] { background: var(--warm-soft); color: var(--warm); font-weight: 500; }
.seg button[aria-pressed="true"][data-kind="down"] { background: var(--cool-soft); color: var(--cool); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px; font-size: 14px; }
.tag.up { background: var(--warm-soft); color: var(--warm); }
.tag.down { background: var(--cool-soft); color: var(--cool); }
.tag .x { border: 0; background: none; color: inherit; opacity: .55; cursor: pointer; font-size: 13px; padding: 0 6px; }
.chip { border: 0; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; background: var(--fill); color: var(--ink-2); transition: background .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

/* rows */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.item:first-child { border-top: 0; padding-top: 4px; }
button.item { cursor: pointer; }
button.item:active { opacity: .6; }
.item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .v { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .chev { color: var(--faint); font-size: 18px; line-height: 1; }
.c-ans { background: var(--accent); } .c-up { background: var(--warm); } .c-down { background: var(--cool); } .c-worry { background: var(--rose); } .c-faint { background: var(--faint); }

/* review */
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav button { border: 0; background: var(--fill); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--ink-2); font-size: 16px; }
.weeknav button[disabled] { opacity: .35; cursor: default; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wd .l { font-size: 12px; color: var(--muted); }
.wd .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.wd.today .n { background: var(--accent); color: var(--bg); font-weight: 600; }
.wd.future { opacity: .35; }
.marks { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 28px; min-height: 6px; }
.marks i { width: 6px; height: 6px; border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: var(--fill); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box .bt { font-size: 13px; font-weight: 600; }
.ranks { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.ranks li { display: flex; justify-content: space-between; gap: 6px; }
.ranks li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranks li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.field-group { display: flex; flex-direction: column; gap: 8px; }
.field-group label { font-size: 15px; font-weight: 500; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; padding: 9px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--faint); cursor: pointer; font-size: 11px; }
.tabbar svg { width: 23px; height: 23px; }
.tabbar button[aria-selected="true"] { color: var(--accent); }

/* bottom sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(20, 24, 30, .32); display: flex; align-items: flex-end; justify-content: center; }
.panel { width: 100%; max-width: 560px; height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; }
.panel .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px 6px; }
.panel .bar .ttl { font-size: 17px; font-weight: 600; }
.panel .bar .r { justify-self: end; }
.panel .bar button { border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--muted); padding: 4px 0; }
.panel .bar .r button { color: var(--accent); font-weight: 600; }
.panel .scroll { overflow-y: auto; padding: 8px 20px calc(30px + env(safe-area-inset-bottom, 0px)); }
.step-n { font-size: 13px; color: var(--accent); font-weight: 600; }

@media (prefers-reduced-motion: no-preference) {
  .sheet.enter { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
  .hero svg .walker { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes rise { from { transform: translateY(18px); } to { transform: none; } }
  @keyframes pulse { 50% { transform: scale(1.35); } }
  .sheet-wrap { animation: fade .25s ease-out; }
  .panel { animation: up .38s cubic-bezier(.2, .9, .25, 1); }
  @keyframes fade { from { background: rgba(0, 0, 0, 0); } }
  @keyframes up { from { transform: translateY(100%); } }
}
</style>

<div class="app"><div class="hero" id="hero" data-sky="day"></div><main class="sheet" id="view"></main></div>
<nav class="tabbar" aria-label="页面"><div class="in" role="tablist" id="tabs"></div></nav>
<div id="sheet-root"></div>

<script>
const QUESTIONS = [
  "今天什么时候，你觉得时间过得最快？",
  "今天哪一刻，你在假装？",
  "如果明天不用为钱工作，你早上醒来会先做什么？",
  "最近一次忘了看手机，你在做什么？",
  "你羡慕谁？羡慕的到底是什么？",
  "小时候的你，会怎么看现在的你？",
  "今天有哪件事，做完之后你觉得没白过？",
  "你最近在逃避什么？",
  "有什么事，即使没人夸你，你也愿意一直做？",
  "你最近一次推翻自己，推翻的是什么？",
  "如果只剩一年，你会继续现在的工作吗？会改掉哪一部分？",
  "今天最消耗你的，是事情本身，还是你对它的想法？",
  "你希望别人怎样记住你？",
  "你身上有哪一点，是以前讨厌、现在开始接受的？",
  "你在什么时候最像你自己？",
  "如果失败没有任何代价，你想试什么？",
  "你现在的面包，除了钱，还给了你什么？",
  "今天你对自己说过最苛刻的一句话是什么？如果朋友这样说自己，你会怎么回？",
  "最近有什么让你好奇，想多了解一点？",
  "你在为谁的期待而活？",
  "你心里的“成功”，最早是从哪里学来的？",
  "今天你帮到了谁，哪怕一点点？",
  "有什么事，你一直说“等以后再说”？",
  "你害怕的那个最坏结果，真的发生了会怎样？",
  "过去一年里，你最骄傲的一个小选择是什么？",
  "哪个话题能让你一口气聊一小时？",
  "如果把你的一天拍成纪录片，哪一段你愿意重看？",
  "你最近一次感到平静是什么时候？",
  "你在等谁的允许？你可以自己给自己吗？",
  "你的热爱也许是一种状态，而不是一件事。那种状态是什么样的？",
  "今天有什么值得感谢的小事？",
  "有什么你曾经确信、现在不再确定的事？",
  "你想对一年后的自己说什么？",
  "你最常用“应该”来要求自己的是哪件事？",
  "如果要你教别人一样东西，你会教什么？",
  "今天你在哪里看到了美？",
  "你现在最大的矛盾是什么？两边各在守护什么？",
  "不考虑别人的眼光，你理想中的普通一天是什么样的？",
  "你真正不愿意放弃的东西是什么？",
  "今天有没有一个瞬间，你想停下来多待一会儿？"
];
const FEELINGS = ["生气", "委屈", "失望", "焦虑", "无力", "被忽视", "难过", "烦躁", "羞愧", "嫉妒"];
const NEEDS = ["被尊重", "被认可", "被理解", "被看见", "公平", "自主", "安全感", "被信任", "边界", "归属"];
const WEEKDAYS = "一二三四五六日";

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  today: svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'),
  worry: svg('<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6 11.3 3.4 3.4 0 0 0 7 18z"/>'),
  review: svg('<path d="M4 19c3-1 4-5 7-6s5 1 9-7"/><circle cx="20" cy="6" r="1.4"/>'),
  letter: svg('<rect x="3.5" y="6" width="17" height="12" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/>')
};

/* ---------- dates & helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const TODAY = ymd(new Date());
const dayNumber = s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const md = s => +s.slice(5, 7) + "月" + +s.slice(8, 10) + "日";
const ago = s => { const n = dayNumber(TODAY) - dayNumber(s); return n === 0 ? "今天" : n === 1 ? "昨天" : n + " 天前"; };
const weekdayCN = s => "星期" + WEEKDAYS[(parseDate(s).getDay() + 6) % 7];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* ---------- storage: the viewer's private db subtree when available, this browser otherwise ---------- */
const LOCAL_KEY = "xunjing-v1";
const store = {
  mode: "local", db: null, uid: null, docs: {}, queues: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) {
          const snap = await db.collection("data/users/" + id).limit(1000).get();
          this.db = db; this.uid = id; this.mode = "cloud";
          snap.docs.forEach(d => { this.docs[d.id] = { ...d.data() }; });
          return;
        }
      }
    } catch (e) { /* fall back to this browser */ }
    try { this.docs = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch (e) { this.docs = {}; }
  },
  saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.docs)); } catch (e) {} },
  ref(id) { return this.db.collection("data/users/" + this.uid).doc(id); },
  enqueue(id, fn) { // one write at a time per document
    const next = (this.queues[id] || Promise.resolve()).catch(() => {}).then(fn);
    this.queues[id] = next;
    return next;
  },
  put(id, data) {
    this.docs[id] = data;
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    const body = JSON.parse(JSON.stringify(data));
    return this.enqueue(id, () => this.ref(id).set(body));
  },
  remove(id) {
    delete this.docs[id];
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    return this.enqueue(id, () => this.ref(id).delete());
  },
  list(type) { return Object.entries(this.docs).filter(([, d]) => d.type === type).map(([id, d]) => ({ id, ...d })); }
};
const whereText = () => store.mode === "cloud" ? "只有你能看到" : "保存在此浏览器";
let statusTimer;
function status(msg) {
  const el = $("save-status"); if (!el) return;
  el.textContent = msg; clearTimeout(statusTimer);
  if (msg === "已保存") statusTimer = setTimeout(() => { if (el.isConnected) el.textContent = whereText(); }, 1600);
}
function put(id, doc) {
  status("保存中…");
  return store.put(id, doc).then(() => status("已保存"), e => {
    status(e && e.code === "quota_exceeded" ? "空间满了，删掉一些旧记录再试" : "没保存上，稍后再试"); throw e;
  });
}
function dayDoc(date) { return store.docs["d-" + date] || { type: "day", date, q: dayNumber(date) % QUESTIONS.length, answer: "", energy: [] }; }
function weekDoc(start) { return store.docs["w-" + start] || { type: "week", start, moment: "", pattern: "", note: "", ai: "" }; }
const hasDay = d => !!(d && ((d.answer && d.answer.trim()) || (d.energy && d.energy.length)));

function autogrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
function grow(el) { if (!el) return; el.addEventListener("input", () => autogrow(el)); requestAnimationFrame(() => autogrow(el)); }
function bindAutosave(el, save) {
  let t, last = el.value;
  const flush = () => { clearTimeout(t); if (el.value === last) return; last = el.value; save(el.value).catch(() => {}); };
  el.addEventListener("input", () => { autogrow(el); clearTimeout(t); t = setTimeout(flush, 900); });
  el.addEventListener("blur", flush);
  requestAnimationFrame(() => autogrow(el));
  return flush;
}
function arm(btn, label, onYes) {
  if (btn.dataset.armed) { onYes(); return; }
  const old = btn.textContent;
  btn.dataset.armed = "1"; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}

/* ---------- the landscape ---------- */
function skyNow() {
  const root = document.documentElement.getAttribute("data-theme");
  const dark = root === "dark" || (root !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  const h = new Date().getHours();
  if (dark || h >= 20 || h < 5) return "night";
  if (h < 9) return "dawn";
  if (h >= 17) return "dusk";
  return "day";
}
function renderHero() {
  const hero = $("hero");
  const sky = skyNow();
  hero.dataset.sky = sky;
  // the walker climbs the path as days are recorded (reaches the top at ~60 days)
  const n = steps();
  const t = Math.min(1, 0.15 + n / 70);
  const P = [[205, 230], [170, 205], [230, 178], [190, 150], [212, 128]];
  const seg = t * (P.length - 1), i = Math.min(P.length - 2, Math.floor(seg)), f = seg - i;
  const wx = P[i][0] + (P[i + 1][0] - P[i][0]) * f, wy = P[i][1] + (P[i + 1][1] - P[i][1]) * f;
  const stars = sky === "night" ? [[40, 30], [90, 55], [140, 22], [260, 40], [320, 20], [360, 60], [300, 75], [60, 80]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="var(--star)"/>`).join("") : "";
  hero.innerHTML = `
  <svg viewBox="0 0 390 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--s1)"/><stop offset="1" stop-color="var(--s2)"/></linearGradient></defs>
    <rect width="390" height="230" fill="url(#sky)"/>
    ${stars}
    <circle cx="${sky === "dusk" ? 90 : 300}" cy="${sky === "dusk" ? 112 : 66}" r="20" fill="var(--sun)" opacity=".95"/>
    <path d="M0 140 L60 112 L110 130 L170 96 L230 124 L290 104 L390 132 V230 H0z" fill="var(--h0)" opacity=".7"/>
    <path d="M0 150 Q80 118 160 142 T390 128 V230 H0z" fill="var(--h1)"/>
    <path d="M0 176 Q100 146 200 168 T390 160 V230 H0z" fill="var(--h2)"/>
    <path d="M0 202 Q110 178 210 198 T390 196 V230 H0z" fill="var(--h3)"/>
    <path d="M205 232 C 160 214, 170 200, 200 192 S 236 172, 214 160 S 196 140, 212 128" fill="none" stroke="var(--path)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 8" opacity=".95"/>
    <circle class="walker" cx="${wx.toFixed(1)}" cy="${wy.toFixed(1)}" r="4.2" fill="#fff"/>
  </svg>
  <span class="steps">Seekway · ${n ? "已走 " + n + " 步" : "从今天出发"}</span>`;
}

/* ---------- 回顾 ---------- */
function countTop(list, n) {
  const c = {};
  list.forEach(x => { const k = String(x).trim(); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n);
}
function weekData(start) {
  const dates = [...Array(7)].map((_, i) => addDays(start, i));
  const days = dates.map(d => store.docs["d-" + d]).filter(Boolean);
  const ws = worries().filter(w => w.date >= start && w.date <= dates[6]);
  return { dates, days, ws };
}
function pickReread() {
  const cands = [
    ...store.list("day").filter(d => d.answer && d.answer.trim()).map(d => ({ id: "d-" + d.date, doc: d })),
    ...worries().map(w => ({ id: w.id, doc: w }))
  ].filter(c => dayNumber(c.doc.date) <= dayNumber(TODAY) - 7);
  const doneToday = cands.find(c => (c.doc.later || []).some(l => l.date === TODAY));
  if (doneToday) return { ...doneToday, done: true };
  const fresh = cands.filter(c => !(c.doc.later || []).length).sort((a, b) => a.doc.date.localeCompare(b.doc.date));
  return fresh.length ? fresh[dayNumber(TODAY) % fresh.length] : null;
}
function weekMaterial(start) {
  const { dates, ws } = weekData(start);
  const lines = [];
  dates.forEach(date => {
    const d = store.docs["d-" + date]; if (!hasDay(d)) return;
    lines.push(`【${md(date)}】`);
    if (d.answer && d.answer.trim()) lines.push(`问：${QUESTIONS[d.q]}\n答：${d.answer.trim().slice(0, 600)}`);
    (d.energy || []).forEach(e => lines.push((e.kind === "up" ? "充电：" : "耗电：") + e.text));
  });
  ws.forEach(w => {
    lines.push(`【心事 · ${md(w.date)}${w.who ? " · 和" + w.who + "有关" : ""}】`);
    lines.push("倒出来的话：" + w.vent.slice(0, 500));
    if (w.fact) lines.push("事实：" + w.fact);
    if ((w.feelings || []).length) lines.push("感受：" + w.feelings.join("、"));
    if ((w.needs || []).length) lines.push("碰到的需要：" + w.needs.join("、"));
    if (w.mine) lines.push("在我手里的：" + w.mine);
    if (w.notMine) lines.push("不在我手里的：" + w.notMine);
  });
  return lines.join("\n");
}

    ${wk.ai ? `<p class="text">${esc(wk.ai)}</p>` : ""}
    <p class="text" id="mirror-live" hidden></p>
    <div class="row between" id="mirror-row" ${sampleFn ? "" : "hidden"}>
      <span class="hint" id="mirror-status"></span>
      <span class="row"><button class="btn link muted" id="mirror-stop" type="button" hidden>停止</button><button class="btn" id="mirror" type="button">${wk.ai ? "重新看一次" : "请它看看这一周"}</button></span>
    </div>
  </div>` : ""}

  <div class="section">
    <div><h2>写给这一周</h2><p class="hint" id="save-status">${whereText()}</p></div>
    <div class="field-group"><label for="r-moment">这周我最真实的一刻</label><textarea class="write short" id="r-moment" placeholder="哪一刻你没有在假装？">${esc(wk.moment)}</textarea></div>
    <div class="field-group"><label for="r-pattern">我注意到的一个重复</label><textarea class="write short" id="r-pattern" placeholder="同样的感受、同样的人、同样的情境">${esc(wk.pattern)}</textarea></div>
    <div class="field-group"><label for="r-note">下周我想对自己说</label><textarea class="write short" id="r-note" placeholder="一句就够">${esc(wk.note)}</textarea></div>
  </div>

  ${rr ? `<div class="section">
    <div><h2>重读</h2><p class="hint">${ago(rr.doc.date)}，你写下了这些。</p></div>
    ${rr.doc.type === "worry" ? `<p class="quote">${esc(rr.doc.vent)}</p>` : `<div class="field-group"><span class="hint">${esc(QUESTIONS[rr.doc.q])}</span><p class="quote">${esc(rr.doc.answer)}</p></div>`}
    ${rr.done ? `<p class="text">${esc(rr.doc.later.find(l => l.date === TODAY).text)}</p><p class="hint">过去的你和现在的你，今天见了一面。</p>`
      : `<textarea class="write short" id="rr-text" placeholder="现在再看，你怎么想？"></textarea><button class="btn primary" id="rr-save" type="button" style="align-self:flex-end">写下现在的想法</button>`}
  </div>` : ""}

  ${heavy.length ? `<div class="section"><div class="head-row"><h2>还压在心上的</h2><span class="hint">${heavy.length} 件</span></div><div class="list">${heavy.slice(0, 5).map(worryItem).join("")}</div></div>` : ""}

  ${pastWeeks.length ? `<div class="section"><button class="item" type="button" data-toggle="weeks" style="padding:0"><span class="main"><h2>以前写给自己的</h2></span><span class="v">${pastWeeks.length} 周 ${ui.open.weeks ? "⌃" : "›"}</span></button>
    ${ui.open.weeks ? pastWeeks.map(w => `<div class="field-group"><span class="hint">${md(w.start)} – ${md(addDays(w.start, 6))}</span>
      ${w.moment ? `<p class="text"><span class="hint">最真实的一刻　</span>${esc(w.moment)}</p>` : ""}
      ${w.pattern ? `<p class="text"><span class="hint">一个重复　</span>${esc(w.pattern)}</p>` : ""}
      ${w.note ? `<p class="text"><span class="hint">对自己说　</span>${esc(w.note)}</p>` : ""}</div>`).join("") : ""}</div>` : ""}`, animate);

  $("prev").onclick = () => { ui.weekStart = addDays(ui.weekStart, -7); renderReview(); };
  $("next").onclick = () => { if (!isThisWeek) { ui.weekStart = addDays(ui.weekStart, 7); renderReview(); } };
  [["r-moment", "moment"], ["r-pattern", "pattern"], ["r-note", "note"]].forEach(([elId, key]) => {
    bindAutosave($(elId), v => { const w = { ...weekDoc(start) }; w[key] = v; return put("w-" + start, w); });
  });
  if (rr && !rr.done) {
    const t = $("rr-text"); grow(t);
    $("rr-save").onclick = () => {
      const text = t.value.trim(); if (!text) { t.focus(); return; }
      const doc = { ...store.docs[rr.id] };
      doc.later = [...(doc.later || []), { date: TODAY, text }];
      put(rr.id, doc).catch(() => {});
      renderReview();
    };
  }
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openWorrySheet(b.dataset.open, () => renderReview()));
  view.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { ui.open[b.dataset.toggle] = !ui.open[b.dataset.toggle]; renderReview(); });

  const mBtn = $("mirror");
  if (mBtn) mBtn.onclick = async () => {
    const live = $("mirror-live"), stop = $("mirror-stop"), st = $("mirror-status");
    const ctl = new AbortController();
    mBtn.disabled = true; stop.hidden = false; live.hidden = false; live.textContent = "正在读这一周…"; st.textContent = "";
    stop.onclick = () => ctl.abort();
    try {
      const { text } = await sampleFn(MIRROR_RULES + weekMaterial(start), { cache: false, signal: ctl.signal, onText: ({ text }) => { live.textContent = text; } });
      put("w-" + start, { ...weekDoc(start), ai: text.trim() }).catch(() => {});
      if (ui.tab === "review") renderReview();
    } catch (e) {
      live.hidden = true; mBtn.disabled = false; stop.hidden = true;
      if (e && e.code === "not_granted") { sampleFn = null; st.textContent = "没有开启这个功能"; }
      else if (e && e.code === "rate_limited") st.textContent = "稍后再试";
      else if (!(e && e.code === "cancelled")) st.textContent = "这次没看成，稍后再试";
    }
  };
}

/* ---------- 来信 ---------- */
function addMonths(dateStr, m) { const d = parseDate(dateStr); d.setMonth(d.getMonth() + m); return ymd(d); }
const ymdCN = s => s.slice(0, 4) + "年" + md(s);
function renderLetter(animate) {
  const letters = store.list("letter").sort((a, b) => a.openOn.localeCompare(b.openOn));
  const open = letters.filter(l => l.openOn <= TODAY), sealed = letters.filter(l => l.openOn > TODAY);
  paint(`
  <div class="section first">
    <div><div class="kicker">写给以后的自己</div><h1>现在的困惑，过一阵子再读会是什么感觉？</h1></div>
    <textarea class="write" id="l-body" placeholder="写写你现在在纠结什么、害怕什么、期待什么。"></textarea>
    <div class="row between">
      <select class="field" id="l-when" aria-label="多久后打开"><option value="1">1 个月后打开</option><option value="3">3 个月后打开</option><option value="6" selected>半年后打开</option><option value="12">1 年后打开</option></select>
      <button class="btn primary" id="l-save" type="button">封存</button>
    </div>
    <p class="hint" id="save-status">${whereText()}</p>
  </div>
  ${sealed.length ? `<div class="section"><div class="head-row"><h2>还在路上的信</h2><span class="hint">${sealed.length} 封</span></div><div class="list">${sealed.map(l => `
    <div class="item"><i class="dot c-faint"></i><span class="main"><span class="t">${ymdCN(l.openOn)} 开启</span><span class="s">写于 ${md(l.date)}</span></span><span class="v">还有 ${dayNumber(l.openOn) - dayNumber(TODAY)} 天</span></div>`).join("")}</div></div>` : ""}
  ${open.length ? `<div class="section"><div class="head-row"><h2>可以拆开的信</h2><span class="hint">${open.length} 封</span></div><div class="list">${open.map(l => `
    <button class="item" type="button" data-toggle="${esc(l.id)}"><i class="dot c-ans"></i><span class="main"><span class="t">写于 ${ymdCN(l.date)}</span>${ui.open[l.id] ? "" : `<span class="s">${esc(l.body)}</span>`}</span><span class="chev">${ui.open[l.id] ? "⌃" : "›"}</span></button>
    ${ui.open[l.id] ? `<div class="field-group" style="padding-bottom:12px"><p class="text">${esc(l.body)}</p><button class="btn link danger" type="button" data-del="${esc(l.id)}" style="align-self:flex-start">删除这封信</button></div>` : ""}`).join("")}</div></div>` : ""}
  ${!letters.length ? `<div class="section"><p class="hint">还没有信。写一封，半年后的你会收到。</p></div>` : ""}`, animate);
  grow($("l-body"));
  $("l-save").onclick = () => {
    const body = $("l-body").value.trim();
    if (!body) { $("l-body").focus(); return; }
    const at = Date.now();
    put("l-" + at, { type: "letter", at, date: TODAY, body, openOn: addMonths(TODAY, +$("l-when").value) }).catch(() => {});
    renderLetter();
  };
  view.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { ui.open[b.dataset.toggle] = !ui.open[b.dataset.toggle]; renderLetter(); });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => arm(b, "再点一次删除", () => { store.remove(b.dataset.del).catch(() => {}); renderLetter(); }));
}

/* ---------- shell ---------- */
const TABS = [["today", "今天", renderToday], ["worry", "心事", renderWorry], ["review", "回顾", renderReview], ["letter", "来信", renderLetter]];
$("tabs").innerHTML = TABS.map(([k, label]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="false">${ICON[k]}<span>${label}</span></button>`).join("");
function show(t) {
  const entry = TABS.find(x => x[0] === t) || TABS[0];
  ui.tab = entry[0];
  try { sessionStorage.setItem("seekway-tab", ui.tab); } catch (e) {}
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  entry[2](true);
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === ui.tab) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  show(b.dataset.tab); window.scrollTo(0, 0);
});
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderHero()); } catch (e) {}

if (window.claude && window.claude.use) {
  window.claude.use("sample").then(fn => {
    sampleFn = fn;
    const row = $("mirror-row"); if (fn && row) row.hidden = false;
  }).catch(() => {});
}
renderHero();
store.init().then(() => { renderHero(); show(ui.tab); });
</script>

</body>
</html>
