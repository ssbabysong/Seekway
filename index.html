<title>Seekway</title>
<style>
/* Layout: iOS idiom — large titles, inset grouped lists, frosted tab bar, bottom sheets. System font stack, one indigo tint. */
:root {
  --bg: #f2f2f7;
  --cell: #ffffff;
  --cell-2: #f2f2f7;
  --label: #000000;
  --label-2: rgba(60, 60, 67, .6);
  --label-3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .2);
  --fill: rgba(120, 120, 128, .12);
  --tint: #5856d6;
  --tint-soft: rgba(88, 86, 214, .12);
  --orange: #ff9500;
  --teal: #30b0c7;
  --pink: #ff2d55;
  --red: #ff3b30;
  --green: #34c759;
  --bar: rgba(249, 249, 249, .82);
  --seg-on: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --cell: #1c1c1e; --cell-2: #2c2c2e; --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .24); --tint: #5e5ce6; --tint-soft: rgba(94, 92, 230, .22);
    --orange: #ff9f0a; --teal: #40c8e0; --pink: #ff375f; --red: #ff453a; --green: #30d158; --bar: rgba(22, 22, 24, .82); --seg-on: #636366;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --cell: #1c1c1e; --cell-2: #2c2c2e; --label: #ffffff; --label-2: rgba(235, 235, 245, .6); --label-3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .24); --tint: #5e5ce6; --tint-soft: rgba(94, 92, 230, .22);
  --orange: #ff9f0a; --teal: #40c8e0; --pink: #ff375f; --red: #ff453a; --green: #30d158; --bar: rgba(22, 22, 24, .82); --seg-on: #636366;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.4; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
.app { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }

/* navigation */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--sep); opacity: 0; pointer-events: none; transition: opacity .2s; }
.navbar.on { opacity: 1; }
.navbar div { height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; }
.large { padding: 14px 4px 6px; }
.large .kicker { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; }
.large .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; margin: 0; }
.appicon { width: 34px; height: 34px; flex: none; display: block; }

/* grouped sections */
.section { margin-top: 30px; }
.section:first-of-type { margin-top: 18px; }
.sh { font-size: 13px; color: var(--label-2); text-transform: uppercase; padding: 0 16px 7px; letter-spacing: .01em; }
.sf { font-size: 13px; color: var(--label-2); padding: 7px 16px 0; line-height: 1.45; }
.card { background: var(--cell); border-radius: 12px; overflow: hidden; }
.pad { padding: 12px 16px; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px; width: 100%; text-align: left; background: none; border: 0; }
.cell + .cell::before, .sep::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
.cell.ico + .cell.ico::before { left: 57px; }
.sep { position: relative; height: 0; }
button.cell { cursor: pointer; }
button.cell:active { background: var(--fill); }
.cell .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.cell .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .s { font-size: 15px; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .v { color: var(--label-2); font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chev { width: 8px; height: 13px; flex: none; color: var(--label-3); }
.sq { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
.sq svg { width: 17px; height: 17px; }
.tintlink { color: var(--tint); background: none; border: 0; padding: 0; cursor: pointer; font-size: 17px; }
.tintlink.bold { font-weight: 600; }
.destruct { color: var(--red); }
.cell.center { justify-content: center; }

/* text input */
.q { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 0; letter-spacing: -.01em; }
textarea.txt { display: block; width: 100%; border: 0; background: transparent; color: var(--label); font: inherit; font-size: 17px; line-height: 1.5; resize: none; padding: 0; min-height: 5.6em; overflow: hidden; }
textarea.txt.short { min-height: 3em; }
textarea.txt:focus, input.inp:focus { outline: none; }
textarea.txt::placeholder, input.inp::placeholder { color: var(--label-3); }
input.inp { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--label); font: inherit; font-size: 17px; padding: 0; text-align: left; }
input.inp.right { text-align: right; }
.formlabel { flex: none; }
select.sel { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--label-2); font: inherit; font-size: 17px; text-align: right; cursor: pointer; padding: 0 2px; }
.bigbtn { display: block; width: 100%; height: 50px; border-radius: 12px; border: 0; background: var(--tint); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 16px; }
.bigbtn:active { opacity: .8; }
.bigbtn[disabled] { opacity: .4; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }

/* segmented & chips */
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; min-width: 150px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 6px 14px; font-size: 15px; background: var(--fill); color: var(--label); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--tint); color: #fff; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--tint-soft); color: var(--tint); white-space: nowrap; }
.xbtn { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label-2); font-size: 13px; line-height: 22px; cursor: pointer; flex: none; padding: 0; }

/* review */
.weeknav { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; margin-top: 10px; }
.weeknav button[disabled] { color: var(--label-3); cursor: default; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); padding: 12px 6px 14px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wd .l { font-size: 11px; font-weight: 600; color: var(--label-2); }
.wd .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-variant-numeric: tabular-nums; }
.wd.today .n { background: var(--tint); color: #fff; font-weight: 600; }
.wd.future { opacity: .35; }
.marks { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 30px; min-height: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.ans { background: var(--tint); } .dot.up { background: var(--orange); } .dot.down { background: var(--teal); } .dot.worry { background: var(--pink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--cell); border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile .tt { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
.tile .tt svg { width: 16px; height: 16px; }
.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ranks li { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.ranks li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ranks li span:last-child { color: var(--label-2); font-variant-numeric: tabular-nums; }
.muted { color: var(--label-2); font-size: 15px; margin: 0; }
.quote { margin: 0; padding-left: 12px; border-left: 3px solid var(--fill); color: var(--label-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
.body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.mini { font-size: 13px; color: var(--label-2); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; padding: 7px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: #999; cursor: pointer; }
.tabbar svg { width: 26px; height: 26px; }
.tabbar button[aria-selected="true"] { color: var(--tint); }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 600px; height: calc(100% - 12px - env(safe-area-inset-top, 0px)); background: var(--bg); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 6px auto 0; flex: none; }
.sheet .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 16px 8px; flex: none; }
.sheet .nav .ttl { font-weight: 600; }
.sheet .nav .r { justify-self: end; }
.sheet .nav .l { justify-self: start; }
.sheet .scroll { overflow-y: auto; padding: 0 16px calc(30px + env(safe-area-inset-bottom, 0px)); flex: 1; -webkit-overflow-scrolling: touch; }
@media (prefers-reduced-motion: no-preference) {
  .sheet-wrap { animation: fade .25s ease-out; }
  .sheet { animation: up .32s cubic-bezier(.2, .9, .3, 1); }
  @keyframes fade { from { background: rgba(0,0,0,0); } }
  @keyframes up { from { transform: translateY(100%); } }
}
@media (max-width: 380px) { h1 { font-size: 30px; } .tiles { grid-template-columns: 1fr; } }
</style>

<div class="app"><main id="view"><div class="large"><h1>Seekway</h1></div></main></div>

<script>
const QUESTIONS = [
  "今天什么时候，你觉得时间过得最快？",
  "今天哪一刻，你在假装？",
  "如果明天不用为钱工作，你早上醒来会先做什么？",
  "最近一次忘了看手机，你在做什么？",
  "你羡慕谁？羡慕的到底是什么？",
  "小时候的你，会怎么看现在的你？",
  "今天有哪件事，做完之后你觉得没白过？",
  "你最近在逃避什么？",
  "有什么事，即使没人夸你，你也愿意一直做？",
  "你最近一次推翻自己，推翻的是什么？",
  "如果只剩一年，你会继续现在的工作吗？会改掉哪一部分？",
  "今天最消耗你的，是事情本身，还是你对它的想法？",
  "你希望别人怎样记住你？",
  "你身上有哪一点，是以前讨厌、现在开始接受的？",
  "你在什么时候最像你自己？",
  "如果失败没有任何代价，你想试什么？",
  "你现在的面包，除了钱，还给了你什么？",
  "今天你对自己说过最苛刻的一句话是什么？如果朋友这样说自己，你会怎么回？",
  "最近有什么让你好奇，想多了解一点？",
  "你在为谁的期待而活？",
  "你心里的“成功”，最早是从哪里学来的？",
  "今天你帮到了谁，哪怕一点点？",
  "有什么事，你一直说“等以后再说”？",
  "你害怕的那个最坏结果，真的发生了会怎样？",
  "过去一年里，你最骄傲的一个小选择是什么？",
  "哪个话题能让你一口气聊一小时？",
  "如果把你的一天拍成纪录片，哪一段你愿意重看？",
  "你最近一次感到平静是什么时候？",
  "你在等谁的允许？你可以自己给自己吗？",
  "你的热爱也许是一种状态，而不是一件事。那种状态是什么样的？",
  "今天有什么值得感谢的小事？",
  "有什么你曾经确信、现在不再确定的事？",
  "你想对一年后的自己说什么？",
  "你最常用“应该”来要求自己的是哪件事？",
  "如果要你教别人一样东西，你会教什么？",
  "今天你在哪里看到了美？",
  "你现在最大的矛盾是什么？两边各在守护什么？",
  "不考虑别人的眼光，你理想中的普通一天是什么样的？",
  "你真正不愿意放弃的东西是什么？",
  "今天有没有一个瞬间，你想停下来多待一会儿？"
];
const FEELINGS = ["生气", "委屈", "失望", "焦虑", "无力", "被忽视", "难过", "烦躁", "羞愧", "嫉妒"];
const NEEDS = ["被尊重", "被认可", "被理解", "被看见", "公平", "自主", "安全感", "被信任", "边界", "归属"];
const WEEKDAYS = "一二三四五六日";

/* ---------- icons ---------- */
const svg = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const ICON = {
  today: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>'),
  worry: svg('<path d="M7 18.5h10.2a4.3 4.3 0 0 0 .6-8.56A6.2 6.2 0 0 0 5.9 11.3 3.6 3.6 0 0 0 7 18.5z"/>'),
  review: svg('<rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.2h.01M12 17.2h.01"/>'),
  letter: svg('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.8 7l8.2 6 8.2-6"/>'),
  up: svg('<path d="M12 19V5M6 11l6-6 6 6"/>', 'stroke-width="2.4"'),
  down: svg('<path d="M12 5v14M6 13l6 6 6-6"/>', 'stroke-width="2.4"'),
  heart: svg('<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>', 'stroke-width="2.2"'),
  person: svg('<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.7 3.6-5.6 7-5.6s6.2 1.9 7 5.6"/>', 'stroke-width="2.2"'),
  lock: svg('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/>', 'stroke-width="2.2"'),
  mail: svg('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.8 7l8.2 6 8.2-6"/>', 'stroke-width="2.2"'),
  sparkle: svg('<path d="M12 3.5l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'),
  leaf: svg('<path d="M5 19c0-8 5.5-13 14-13 0 8.5-5 14-13 14"/><path d="M5 19l7-7"/>', 'stroke-width="2.2"'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 'stroke-width="2.4"'),
  clock: svg('<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>', 'stroke-width="2.2"')
};
const CHEV = `<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5"/></svg>`;
const APPICON = `<svg class="appicon" viewBox="0 0 64 64" role="img" aria-label="Seekway"><defs><linearGradient id="ai-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a78f2"/><stop offset="1" stop-color="#4a47c4"/></linearGradient></defs><rect width="64" height="64" rx="14.5" fill="url(#ai-g)"/><path d="M21 49V30.5a11 11 0 0 1 22 0V49" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="32" cy="39" r="4.4" fill="#fff"/></svg>`;
const sq = (color, icon) => `<span class="sq" style="background:var(--${color})">${ICON[icon]}</span>`;

/* ---------- dates & helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const TODAY = ymd(new Date());
const dayNumber = s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const md = s => +s.slice(5, 7) + "月" + +s.slice(8, 10) + "日";
const ago = s => { const n = dayNumber(TODAY) - dayNumber(s); return n === 0 ? "今天" : n === 1 ? "昨天" : n + " 天前"; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* ---------- storage: the viewer's private db subtree when available, this browser otherwise ---------- */
const LOCAL_KEY = "xunjing-v1";
const store = {
  mode: "local", db: null, uid: null, docs: {}, queues: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) {
          const snap = await db.collection("data/users/" + id).limit(1000).get();
          this.db = db; this.uid = id; this.mode = "cloud";
          snap.docs.forEach(d => { this.docs[d.id] = { ...d.data() }; });
          return;
        }
      }
    } catch (e) { /* fall back to this browser */ }
    try { this.docs = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch (e) { this.docs = {}; }
  },
  saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.docs)); } catch (e) {} },
  ref(id) { return this.db.collection("data/users/" + this.uid).doc(id); },
  enqueue(id, fn) { // one write at a time per document

  },
  put(id, data) {
    this.docs[id] = data;
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    const body = JSON.parse(JSON.stringify(data));
    return this.enqueue(id, () => this.ref(id).set(body));
  },
  remove(id) {
    delete this.docs[id];
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    return this.enqueue(id, () => this.ref(id).delete());

};

  el.addEventListener("input", () => { autogrow(el); clearTimeout(t); t = setTimeout(flush, 900); });

}

function countTop(list, n) {
  const c = {};
  list.forEach(x => { const k = String(x).trim(); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n);
}
function weekData(start) {
  const dates = [...Array(7)].map((_, i) => addDays(start, i));
  const days = dates.map(d => store.docs["d-" + d]).filter(Boolean);
  const ws = worries().filter(w => w.date >= start && w.date <= dates[6]);
  return { dates, days, ws };
}
function pickReread() {
  const cands = [
    ...store.list("day").filter(d => d.answer && d.answer.trim()).map(d => ({ id: "d-" + d.date, doc: d })),
    ...worries().map(w => ({ id: w.id, doc: w }))
  ].filter(c => dayNumber(c.doc.date) <= dayNumber(TODAY) - 7);
  const doneToday = cands.find(c => (c.doc.later || []).some(l => l.date === TODAY));
  if (doneToday) return { ...doneToday, done: true };
  const fresh = cands.filter(c => !(c.doc.later || []).length).sort((a, b) => a.doc.date.localeCompare(b.doc.date));
  return fresh.length ? fresh[dayNumber(TODAY) % fresh.length] : null;
}
function weekMaterial(start) {
  const { dates, ws } = weekData(start);
  const lines = [];
  dates.forEach(date => {
    const d = store.docs["d-" + date]; if (!hasDay(d)) return;
    lines.push(`【${md(date)}】`);
    if (d.answer && d.answer.trim()) lines.push(`问：${QUESTIONS[d.q]}\n答：${d.answer.trim().slice(0, 600)}`);
    (d.energy || []).forEach(e => lines.push((e.kind === "up" ? "充电：" : "耗电：") + e.text));
  });
  ws.forEach(w => {
    lines.push(`【心事 · ${md(w.date)}${w.who ? " · 和" + w.who + "有关" : ""}】`);
    lines.push("倒出来的话：" + w.vent.slice(0, 500));

    if (w.mine) lines.push("在我手里的：" + w.mine);
    if (w.notMine) lines.push("不在我手里的：" + w.notMine);
  });
  return lines.join("\n");
}

      <div class="pad stack" style="gap:4px"><label class="mini" for="r-moment">这周我最真实的一刻</label><textarea class="txt short" id="r-moment" placeholder="哪一刻你没有在假装？">${esc(wk.moment)}</textarea></div>
      <div class="sep"></div>
      <div class="pad stack" style="gap:4px"><label class="mini" for="r-pattern">我注意到的一个重复</label><textarea class="txt short" id="r-pattern" placeholder="同样的感受、同样的人、同样的情境">${esc(wk.pattern)}</textarea></div>
      <div class="sep"></div>
      <div class="pad stack" style="gap:4px"><label class="mini" for="r-note">下周我想对自己说</label><textarea class="txt short" id="r-note" placeholder="一句就够">${esc(wk.note)}</textarea></div>
    </div>`, `<span id="save-status">${whereText()}</span>`)}

  ${rr ? section("重读 · " + ago(rr.doc.date), `<div class="card">
      <div class="pad stack">
        ${rr.doc.type === "worry" ? `<span class="mini">一件心事</span><p class="quote">${esc(rr.doc.vent)}</p>` : `<span class="mini">${esc(QUESTIONS[rr.doc.q])}</span><p class="quote">${esc(rr.doc.answer)}</p>`}
        ${rr.done ? `<p class="body">${esc(rr.doc.later.find(l => l.date === TODAY).text)}</p>` : `<textarea class="txt short" id="rr-text" placeholder="现在再看，你怎么想？"></textarea>`}
      </div>
      ${rr.done ? "" : `<div class="cell"><span class="main"></span><button class="tintlink bold" id="rr-save" type="button">写下现在的想法</button></div>`}
    </div>`, rr.done ? "过去的你和现在的你，今天见了一面。" : "每天一条，回头看看那时的自己。") : ""}

  ${heavy.length ? section("还压在心上的", `<div class="card">${heavy.slice(0, 5).map(worryRow).join("")}</div>`) : ""}

  ${pastWeeks.length ? section("", `<div class="card">
    <button class="cell" type="button" data-toggle="weeks"><span class="main">以前写给自己的</span><span class="v">${pastWeeks.length} 周</span>${CHEV}</button>
    ${ui.open.weeks ? pastWeeks.map(w => `<div class="cell"><span class="main stack" style="gap:6px">
      <span class="mini">${md(w.start)} – ${md(addDays(w.start, 6))}</span>
      ${w.moment ? `<p class="body"><span class="muted">最真实的一刻　</span>${esc(w.moment)}</p>` : ""}
      ${w.pattern ? `<p class="body"><span class="muted">一个重复　</span>${esc(w.pattern)}</p>` : ""}
      ${w.note ? `<p class="body"><span class="muted">对自己说　</span>${esc(w.note)}</p>` : ""}
    </span></div>`).join("") : ""}
  </div>`) : ""}`;

  $("prev").onclick = () => { ui.weekStart = addDays(ui.weekStart, -7); renderReview(); };
  $("next").onclick = () => { if (!isThisWeek) { ui.weekStart = addDays(ui.weekStart, 7); renderReview(); } };
  [["r-moment", "moment"], ["r-pattern", "pattern"], ["r-note", "note"]].forEach(([elId, key]) => {
    bindAutosave($(elId), v => { const w = { ...weekDoc(start) }; w[key] = v; return put("w-" + start, w); });
  });
  if (rr && !rr.done) {
    const t = $("rr-text"); grow(t);
    $("rr-save").onclick = () => {
      const text = t.value.trim(); if (!text) { t.focus(); return; }
      const doc = { ...store.docs[rr.id] };
      doc.later = [...(doc.later || []), { date: TODAY, text }];
      put(rr.id, doc).catch(() => {});
      renderReview();
    };
  }
  bindListActions(renderReview);

  const mBtn = $("mirror");
  if (mBtn) mBtn.onclick = async () => {
    const live = $("mirror-live"), stop = $("mirror-stop"), st = $("mirror-status");
    const ctl = new AbortController();
    mBtn.disabled = true; stop.hidden = false; live.hidden = false; live.textContent = "正在读这一周…"; st.textContent = "";
    stop.onclick = () => ctl.abort();
    try {
      const { text } = await sampleFn(MIRROR_RULES + weekMaterial(start), { cache: false, signal: ctl.signal, onText: ({ text }) => { live.textContent = text; } });
      put("w-" + start, { ...weekDoc(start), ai: text.trim() }).catch(() => {});
      if (ui.tab === "review") renderReview();
    } catch (e) {
      live.hidden = true; mBtn.disabled = false; stop.hidden = true;
      if (e && e.code === "not_granted") { sampleFn = null; st.textContent = "未开启"; }
      else if (e && e.code === "rate_limited") st.textContent = "稍后再试";
      else if (!(e && e.code === "cancelled")) st.textContent = "这次没看成";
    }
  };
}

/* ---------- 来信 ---------- */
function addMonths(dateStr, m) { const d = parseDate(dateStr); d.setMonth(d.getMonth() + m); return ymd(d); }
const ymdCN = s => s.slice(0, 4) + "年" + md(s);
function renderLetter() {
  const letters = store.list("letter").sort((a, b) => a.openOn.localeCompare(b.openOn));
  const open = letters.filter(l => l.openOn <= TODAY), sealed = letters.filter(l => l.openOn > TODAY);
  view.innerHTML = `
  ${largeTitle("写给以后的自己", "来信", true)}
  ${section("", `
    <div class="card">
      <div class="pad"><textarea class="txt" id="l-body" placeholder="写写你现在在纠结什么、害怕什么、期待什么。"></textarea></div>
      <div class="cell"><label class="formlabel" for="l-when">打开时间</label><span class="main"></span>
        <select class="sel" id="l-when"><option value="1">1 个月后</option><option value="3">3 个月后</option><option value="6" selected>半年后</option><option value="12">1 年后</option></select>${CHEV}</div>
    </div>
    <button class="bigbtn" id="l-save" type="button">封存</button>`, "到了那天，这封信才能打开。")}
  ${open.length ? section("可以拆开的信", `<div class="card">${open.map(l => `
    <button class="cell ico" type="button" data-toggle="${esc(l.id)}">${sq("tint", "mail")}<span class="main"><span class="t">写于 ${ymdCN(l.date)}</span><span class="s">${esc(l.body)}</span></span>${CHEV}</button>
    ${ui.open[l.id] ? `<div class="cell"><span class="main stack"><p class="body">${esc(l.body)}</p><span><button class="tintlink destruct" type="button" data-del="${esc(l.id)}">删除</button></span></span></div>` : ""}`).join("")}</div>`) : ""}
  ${sealed.length ? section("还在路上的信", `<div class="card">${sealed.map(l => `
    <div class="cell ico">${sq("label-3", "lock")}<span class="main"><span class="t">${ymdCN(l.openOn)} 开启</span><span class="s">写于 ${md(l.date)}</span></span><span class="v">还有 ${dayNumber(l.openOn) - dayNumber(TODAY)} 天</span></div>`).join("")}</div>`) : ""}`;
  grow($("l-body"));
  $("l-save").onclick = () => {
    const body = $("l-body").value.trim();
    if (!body) { $("l-body").focus(); return; }
    const at = Date.now();
    put("l-" + at, { type: "letter", at, date: TODAY, body, openOn: addMonths(TODAY, +$("l-when").value) }).catch(() => {});
    renderLetter();
  };
  view.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { ui.open[b.dataset.toggle] = !ui.open[b.dataset.toggle]; renderLetter(); });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => arm(b, "确定删除", () => { store.remove(b.dataset.del).catch(() => {}); renderLetter(); }));
}

/* ---------- shell ---------- */
const TABS = [["today", "今天", renderToday], ["worry", "心事", renderWorry], ["review", "回顾", renderReview], ["letter", "来信", renderLetter]];
$("tabs").innerHTML = TABS.map(([k, label]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="false">${ICON[k]}<span>${label}</span></button>`).join("");
function show(t) {
  const entry = TABS.find(x => x[0] === t) || TABS[0];
  ui.tab = entry[0];
  try { sessionStorage.setItem("seekway-tab", ui.tab); } catch (e) {}
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  entry[2]();
  onScroll();
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === ui.tab) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  show(b.dataset.tab); window.scrollTo(0, 0);
});
function onScroll() { $("navbar").classList.toggle("on", window.scrollY > 60); }
window.addEventListener("scroll", onScroll, { passive: true });

if (window.claude && window.claude.use) {
  window.claude.use("sample").then(fn => {
    sampleFn = fn;
    const row = $("mirror-row"); if (fn && row) row.hidden = false;
  }).catch(() => {});
}
store.init().then(() => show(ui.tab));
</script>

</body>
</html>
