<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seekway">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#cfdcec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c2537" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seekway</title>
<style>
/* Layout: a landscape with a winding path across the top (sky follows the time of day), then one white sheet of clearly spaced sections. Type scale: 20 / 17 / 15 / 13. */
:root {
  --bg: #ffffff;
  --ink: #22262c;
  --ink-2: #4b525c;
  --muted: #8a919c;
  --faint: #b8bec7;
  --line: #eceef1;
  --fill: #f4f5f7;
  --accent: #4f7a5f;
  --accent-soft: #e8f0ea;
  --warm: #9a7444;
  --warm-soft: #f3ede3;
  --cool: #5f7890;
  --cool-soft: #e8eef4;
  --rose: #b46a78;
  --rose-soft: #f6eaed;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181b; --ink: #eceef0; --ink-2: #c3c8ce; --muted: #8c939c; --faint: #5a616a; --line: #26292e; --fill: #1f2226;
    --accent: #8fbf9d; --accent-soft: #20302a; --warm: #d8b07a; --warm-soft: #33291c; --cool: #9db6cc; --cool-soft: #1f2a35;
    --rose: #e29aa8; --rose-soft: #3a252a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181b; --ink: #eceef0; --ink-2: #c3c8ce; --muted: #8c939c; --faint: #5a616a; --line: #26292e; --fill: #1f2226;
  --accent: #8fbf9d; --accent-soft: #20302a; --warm: #d8b07a; --warm-soft: #33291c; --cool: #9db6cc; --cool-soft: #1f2a35;
  --rose: #e29aa8; --rose-soft: #3a252a; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior-y: none; }
body { overflow-x: hidden; overscroll-behavior-y: none; }
button, .tabbar, .hero { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* landscape */
.hero { position: relative; height: 250px; overflow: hidden; cursor: zoom-in; transition: height .5s cubic-bezier(.2, .9, .25, 1); }
.hero.open { cursor: zoom-out; }
.hero.dragging { transition: none; }
.hero .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
.hero .pull-hint { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 12px; color: rgba(255, 255, 255, .9); text-shadow: 0 1px 4px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .3s; pointer-events: none; }
.hero.open .pull-hint { opacity: 1; }
.hero > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero[data-sky="day"]   { --s1: #cfdcec; --s2: #f3ece3; --sun: #fbe3c8; --h0: #c9d4e0; --h1: #b9c9d8; --h2: #9fb7a6; --h3: #86a58f; --path: #f6f1e8; --star: transparent; }
.hero[data-sky="dawn"]  { --s1: #dbe3f0; --s2: #fbe6d6; --sun: #ffd9b8; --h0: #ccd3e2; --h1: #bcc8d9; --h2: #a3b9aa; --h3: #8aa793; --path: #fbf3ea; --star: transparent; }
.hero[data-sky="dusk"]  { --s1: #d4cbe5; --s2: #f8d9c7; --sun: #ffcfac; --h0: #c4bdd4; --h1: #b3afc8; --h2: #98a5a6; --h3: #7d9286; --path: #fbeee2; --star: transparent; }
.hero[data-sky="night"] { --s1: #1c2537; --s2: #39405a; --sun: #ebe6d2; --h0: #2f3850; --h1: #3a4560; --h2: #33475a; --h3: #2b3f48; --path: #c3cad8; --star: #e9ecf5; }
.hero .steps { position: absolute; left: 20px; top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 13px; color: rgba(34, 38, 44, .62); }
.hero .steps { display: inline-flex; align-items: center; gap: 7px; }
.hero .logo { width: 20px; height: 20px; border-radius: 5px; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.hero[data-sky="night"] .steps { color: rgba(236, 240, 248, .7); }

/* sheet */
.sheet { position: relative; margin-top: -26px; background: var(--bg); border-radius: 26px 26px 0 0; padding: 26px 20px 0; }
.sheet::before { content: ""; position: absolute; top: 9px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
.kicker { font-size: 13px; color: var(--muted); }
h1 { font-size: 20px; font-weight: 600; line-height: 1.5; margin: 4px 0 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; line-height: 1.5; margin: 0; }
.section { padding: 26px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.section.first { border-top: 0; padding-top: 0; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
.text { margin: 0; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.quote { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--fill); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }

/* inputs */
textarea.write { display: block; width: 100%; border: 0; border-radius: 14px; background: var(--fill); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.75; padding: 12px 14px; resize: none; min-height: 112px; overflow: hidden; }
textarea.write.short { min-height: 76px; }
input.field { width: 100%; min-width: 0; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font: inherit; font-size: 16px; padding: 10px 14px; }
select.field { appearance: none; -webkit-appearance: none; width: auto; cursor: pointer; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
textarea.write:focus, input.field:focus, select.field:focus { outline: 2px solid var(--accent-soft); }
textarea::placeholder, input::placeholder { color: var(--faint); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row > input.field { flex: 1 1 160px; }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-size: 15px; font-weight: 500; cursor: pointer; background: var(--fill); color: var(--ink); transition: transform .12s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--bg); }
.btn.block { width: 100%; padding: 13px; }
.btn.link { background: none; padding: 4px 0; color: var(--accent); font-size: 14px; font-weight: 500; }
.btn.link.muted { color: var(--muted); }
.btn.link.danger { color: var(--rose); }
.btn[disabled] { opacity: .45; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 14px; font-size: 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"][data-kind="up"] { background: var(--warm-soft); color: var(--warm); font-weight: 500; }
.seg button[aria-pressed="true"][data-kind="down"] { background: var(--cool-soft); color: var(--cool); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px; font-size: 14px; }
.tag.up { background: var(--warm-soft); color: var(--warm); }
.tag.down { background: var(--cool-soft); color: var(--cool); }
.tag .x { border: 0; background: none; color: inherit; opacity: .55; cursor: pointer; font-size: 13px; padding: 0 6px; }
.chip { border: 0; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; background: var(--fill); color: var(--ink-2); transition: background .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

/* rows */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.item:first-child { border-top: 0; padding-top: 4px; }
button.item { cursor: pointer; }
button.item:active { opacity: .6; }
.item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .v { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .chev { color: var(--faint); font-size: 18px; line-height: 1; }
.c-ans { background: var(--accent); } .c-up { background: var(--warm); } .c-down { background: var(--cool); } .c-worry { background: var(--rose); } .c-faint { background: var(--faint); }

/* review */
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav button { border: 0; background: var(--fill); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--ink-2); font-size: 16px; }
.weeknav button[disabled] { opacity: .35; cursor: default; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wd .l { font-size: 12px; color: var(--muted); }
.wd .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.wd.today .n { background: var(--accent); color: var(--bg); font-weight: 600; }
.wd.future { opacity: .35; }
.marks { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 28px; min-height: 6px; }
.marks i { width: 6px; height: 6px; border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: var(--fill); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box .bt { font-size: 13px; font-weight: 600; }
.ranks { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.ranks li { display: flex; justify-content: space-between; gap: 6px; }
.ranks li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranks li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.field-group { display: flex; flex-direction: column; gap: 8px; }
.field-group label { font-size: 15px; font-weight: 500; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; padding: 9px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--faint); cursor: pointer; font-size: 11px; }
.tabbar svg { width: 23px; height: 23px; }
.tabbar button[aria-selected="true"] { color: var(--accent); }

/* bottom sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(20, 24, 30, .32); display: flex; align-items: flex-end; justify-content: center; }
.panel { width: 100%; max-width: 560px; height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; }
.panel .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px 6px; }
.panel .bar .ttl { font-size: 17px; font-weight: 600; }
.panel .bar .r { justify-self: end; }
.panel .bar button { border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--muted); padding: 4px 0; }
.panel .bar .r button { color: var(--accent); font-weight: 600; }
.panel .scroll { overflow-y: auto; padding: 8px 20px calc(30px + env(safe-area-inset-bottom, 0px)); }
.step-n { font-size: 13px; color: var(--accent); font-weight: 600; }

/* cover */
.cover-btn { position: absolute; right: 14px; top: calc(10px + env(safe-area-inset-top, 0px)); width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #2b3038; background: rgba(255, 255, 255, .55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.cover-btn svg { width: 18px; height: 18px; }
.hero[data-sky="night"] .cover-btn, .hero[data-sky="photo"] .cover-btn { color: #fff; background: rgba(0, 0, 0, .28); }
.hero[data-sky="photo"] .steps { color: rgba(255, 255, 255, .9); text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.panel.small { height: auto; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); }
.covers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cover-opt { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); text-align: left; }
.cover-opt svg, .cover-opt .cover-add { width: 100%; aspect-ratio: 390 / 200; border-radius: 14px; display: block; outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
.cover-opt .cover-add { display: grid; place-items: center; background: var(--fill); color: var(--muted); font-size: 26px; }
.cover-opt[aria-pressed="true"] svg, .cover-opt[aria-pressed="true"] .cover-add { outline-color: var(--accent); }
.cover-opt[aria-pressed="true"] { color: var(--accent); font-weight: 500; }

/* road */
:root { --road: #eef0ec; --road-line: #c6ccc2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --road: #23272a; --road-line: #4a524c; } }
:root[data-theme="dark"] { --road: #23272a; --road-line: #4a524c; }
.seg.plain button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 500; box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
.road { position: relative; margin-top: 6px; }
.road > svg { position: absolute; inset: 0; overflow: visible; }
.rstop { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
.rstop[disabled] { cursor: default; }
.rnode { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--bg); display: grid; place-items: center; transition: transform .15s; }
.rstop:not([disabled]):active .rnode { transform: scale(.85); }
.rnode.tone-up { background: var(--warm); }
.rnode.tone-down { background: var(--cool); }
.rnode.has-worry { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--rose); }
.rnode.here { width: 20px; height: 20px; background: var(--accent); box-shadow: 0 0 0 4px var(--bg), 0 0 0 9px var(--accent-soft); }
.rnode.here.tone-up { background: var(--warm); }
.rnode.here.tone-down { background: var(--cool); }
.rnode.week, .rnode.start { width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.rnode.start { background: var(--fill); color: var(--muted); }
.rnode svg { width: 17px; height: 17px; }
.rlabel { position: absolute; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1px; }
.rlabel.l { text-align: right; align-items: flex-end; }
.rlabel .rt { font-size: 13px; color: var(--muted); }
.rel { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.rlabel.l .rel { justify-content: flex-end; }
.re { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.re.up { background: var(--warm-soft); color: var(--warm); }
.re.down { background: var(--cool-soft); color: var(--cool); }
.legend .ring { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rose); }
.rlabel .rb { font-size: 15px; color: var(--ink); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: no-preference) {
  .rnode.here { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 13px var(--accent-soft); } }
  .pop { animation: pop .45s cubic-bezier(.2, .9, .3, 1.2) both; }
  @keyframes pop { from { transform: translateY(-50%) scale(.7); } }
  .rstop.pop { animation-name: popnode; }
  @keyframes popnode { from { transform: scale(.4); } }
  .sheet.enter { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
  .hero svg .walker { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes rise { from { transform: translateY(18px); } to { transform: none; } }
  @keyframes pulse { 50% { transform: scale(1.35); } }
  .sheet-wrap { animation: fade .25s ease-out; }
  .panel { animation: up .38s cubic-bezier(.2, .9, .25, 1); }
  @keyframes fade { from { background: rgba(0, 0, 0, 0); } }
  @keyframes up { from { transform: translateY(100%); } }
}
</style>

<div class="app"><div class="hero" id="hero" data-sky="day"></div><main class="sheet" id="view"></main></div>
<nav class="tabbar" aria-label="页面"><div class="in" role="tablist" id="tabs"></div></nav>
<div id="sheet-root"></div>

<script>
const QUESTIONS = [
  "今天什么时候，你觉得时间过得最快？",
  "今天哪一刻，你在假装？",
  "如果明天不用为钱工作，你早上醒来会先做什么？",
  "最近一次忘了看手机，你在做什么？",
  "你羡慕谁？羡慕的到底是什么？",
  "小时候的你，会怎么看现在的你？",
  "今天有哪件事，做完之后你觉得没白过？",
  "你最近在逃避什么？",
  "有什么事，即使没人夸你，你也愿意一直做？",
  "你最近一次推翻自己，推翻的是什么？",
  "如果只剩一年，你会继续现在的工作吗？会改掉哪一部分？",
  "今天最消耗你的，是事情本身，还是你对它的想法？",
  "你希望别人怎样记住你？",
  "你身上有哪一点，是以前讨厌、现在开始接受的？",
  "你在什么时候最像你自己？",
  "如果失败没有任何代价，你想试什么？",
  "你现在的面包，除了钱，还给了你什么？",
  "今天你对自己说过最苛刻的一句话是什么？如果朋友这样说自己，你会怎么回？",
  "最近有什么让你好奇，想多了解一点？",
  "你在为谁的期待而活？",
  "你心里的“成功”，最早是从哪里学来的？",
  "今天你帮到了谁，哪怕一点点？",
  "有什么事，你一直说“等以后再说”？",
  "你害怕的那个最坏结果，真的发生了会怎样？",
  "过去一年里，你最骄傲的一个小选择是什么？",
  "哪个话题能让你一口气聊一小时？",
  "如果把你的一天拍成纪录片，哪一段你愿意重看？",
  "你最近一次感到平静是什么时候？",
  "你在等谁的允许？你可以自己给自己吗？",
  "你的热爱也许是一种状态，而不是一件事。那种状态是什么样的？",
  "今天有什么值得感谢的小事？",
  "有什么你曾经确信、现在不再确定的事？",
  "你想对一年后的自己说什么？",

const LOCAL_KEY = "xunjing-v1";
const store = {
  mode: "local", db: null, uid: null, docs: {}, queues: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) {
          const snap = await db.collection("data/users/" + id).limit(1000).get();
          this.db = db; this.uid = id; this.mode = "cloud";
          snap.docs.forEach(d => { this.docs[d.id] = { ...d.data() }; });
          return;
        }
      }
    } catch (e) { /* fall back to this browser */ }
    try { this.docs = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch (e) { this.docs = {}; }
  },
  saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.docs)); } catch (e) {} },
  ref(id) { return this.db.collection("data/users/" + this.uid).doc(id); },
  enqueue(id, fn) { // one write at a time per document
    const next = (this.queues[id] || Promise.resolve()).catch(() => {}).then(fn);
    this.queues[id] = next;
    return next;
  },
  put(id, data) {
    this.docs[id] = data;
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    const body = JSON.parse(JSON.stringify(data));
    return this.enqueue(id, () => this.ref(id).set(body));
  },
  remove(id) {
    delete this.docs[id];
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    return this.enqueue(id, () => this.ref(id).delete());

function loadPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let q = .82, out = c.toDataURL("image/jpeg", q);
      while (out.length > 190000 && q > .35) { q -= .1; out = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url);
      out.length > 230000 ? reject(new Error("too_big")) : resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable")); };
    img.src = url;
  });
}

/* ---------- 回顾 ---------- */
function countTop(list, n) {
  const c = {};
  list.forEach(x => { const k = String(x).trim(); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n);
}
function weekData(start) {
  const dates = [...Array(7)].map((_, i) => addDays(start, i));
  const days = dates.map(d => store.docs["d-" + d]).filter(Boolean);
  const ws = worries().filter(w => w.date >= start && w.date <= dates[6]);
  return { dates, days, ws };
}
function pickReread() {
  const cands = [
    ...store.list("day").filter(d => d.answer && d.answer.trim()).map(d => ({ id: "d-" + d.date, doc: d })),
    ...worries().map(w => ({ id: w.id, doc: w }))
  ].filter(c => dayNumber(c.doc.date) <= dayNumber(TODAY) - 7);
  const doneToday = cands.find(c => (c.doc.later || []).some(l => l.date === TODAY));
  if (doneToday) return { ...doneToday, done: true };
  const fresh = cands.filter(c => !(c.doc.later || []).length).sort((a, b) => a.doc.date.localeCompare(b.doc.date));
  return fresh.length ? fresh[dayNumber(TODAY) % fresh.length] : null;
}
function weekMaterial(start) {
  const { dates, ws } = weekData(start);
  const lines = [];
  dates.forEach(date => {
    const d = store.docs["d-" + date]; if (!hasDay(d)) return;
    lines.push(`【${md(date)}】`);
    if (d.answer && d.answer.trim()) lines.push(`问：${QUESTIONS[d.q]}\n答：${d.answer.trim().slice(0, 600)}`);
    (d.energy || []).forEach(e => lines.push((e.kind === "up" ? "充电：" : "耗电：") + e.text));
  });
  ws.forEach(w => {
    lines.push(`【心事 · ${md(w.date)}${w.who ? " · 和" + w.who + "有关" : ""}】`);
    lines.push("倒出来的话：" + w.vent.slice(0, 500));
    if (w.fact) lines.push("事实：" + w.fact);
    if ((w.feelings || []).length) lines.push("感受：" + w.feelings.join("、"));
    if ((w.needs || []).length) lines.push("碰到的需要：" + w.needs.join("、"));
    if (w.mine) lines.push("在我手里的：" + w.mine);
    if (w.notMine) lines.push("不在我手里的：" + w.notMine);
  });
  return lines.join("\n");
}
const MIRROR_RULES = `你在陪一个人做每周回顾。下面是对方这一周在日记里留下的全部记录。

请像一面镜子，用中文写 3 条观察，每条一到两句：指出你在这些记录里看到的重复、矛盾或变化，尽量引用对方的原话。
不给建议，不评判，不做心理诊断，不说空洞的安慰。
最后单独一行，用一个开放的问题收尾，邀请对方自己去想。
只输出这 4 行，不要标题，不要编号。
如果记录里流露出伤害自己或不想活下去的念头，就不要做观察：温和地表达在意，请对方现在联系一个信任的人，或拨打心理援助热线（中国大陆 12356）。

      if (ui.tab === "review") renderReview();
    } catch (e) {
      live.hidden = true; mBtn.disabled = false; stop.hidden = true;
      if (e && e.code === "not_granted") { sampleFn = null; st.textContent = "没有开启这个功能"; }
      else if (e && e.code === "rate_limited") st.textContent = "稍后再试";
      else if (!(e && e.code === "cancelled")) st.textContent = "这次没看成，稍后再试";
    }
  };
}

/* ---------- 回顾 · 一路走来 ---------- */
function roadStops() {
  const byDate = {};
  const at = date => (byDate[date] = byDate[date] || { kind: "day", date, day: null, worries: [], letters: [] });
  store.list("day").filter(hasDay).forEach(d => { at(d.date).day = d; });
  worries().forEach(w => at(w.date).worries.push(w));
  store.list("letter").forEach(l => at(l.date).letters.push(l));
  const stops = Object.values(byDate);
  // number the days that have a record, oldest first
  stops.filter(s => s.day).sort((a, b) => a.date.localeCompare(b.date)).forEach((s, i) => { s.step = i + 1; });
  store.list("week").filter(w => w.moment || w.pattern || w.note || w.ai).forEach(w => {
    const end = addDays(w.start, 6);
    stops.push({ kind: "week", date: end > TODAY ? TODAY : end, week: w });
  });
  // newest first; a week's flag stands just above the days of that week
  stops.sort((a, b) => b.date.localeCompare(a.date) || (a.kind === "week" ? -1 : 1));
  return stops;
}
function stopSnippet(s) {
  if (s.kind === "week") return s.week.note || s.week.moment || s.week.pattern || "写给这一周的话";
  if (s.day && s.day.answer && s.day.answer.trim()) return s.day.answer.trim();
  if (s.worries.length) return s.worries[0].fact || s.worries[0].vent;

  if (s.letters.length) return "写了一封给以后的信";
  return "";
}
function stopTone(s) {
  if (s.kind === "week") return "week";
  const e = (s.day && s.day.energy) || [];
  const up = e.filter(x => x.kind === "up").length, down = e.filter(x => x.kind === "down").length;
  return up > down ? "up" : down > up ? "down" : "calm";
}
let roadResize;
function energyLine(s) {
  const e = (s && s.day && s.day.energy) || [];
  if (!e.length) return "";
  const up = e.filter(x => x.kind === "up"), down = e.filter(x => x.kind === "down");
  const part = (arr, kind) => arr.length ? `<span class="re ${kind}">${kind === "up" ? "↑ 充电" : "↓ 耗电"} ${esc(arr.slice(0, 2).map(x => x.text).join("、"))}${arr.length > 2 ? " 等" : ""}</span>` : "";
  return `<span class="rel">${part(up, "up")}${part(down, "down")}</span>`;
}
function renderRoad(animate) {
  const stops = roadStops();
  const todayStop = stops.find(s => s.kind === "day" && s.date === TODAY);
  const list = [{ kind: "here", date: TODAY, stop: todayStop }, ...stops.filter(s => s !== todayStop)];
  const first = stops.filter(s => s.kind === "day").map(s => s.date).sort()[0];
  list.push({ kind: "start", date: first || TODAY });
  paint(`
  <div class="section first">
    ${reviewSwitch()}
    <div><div class="kicker">${first ? "从 " + md(first) + " 到今天" : "从今天开始"}</div><h1>一路走来</h1></div>
    <p class="hint">${stops.filter(s => s.day).length ? `你已经走了 ${stops.filter(s => s.day).length} 步。点路上的任意一站，回到那一天。` : "每记录一天，路上就多一站。"}</p>
    <div class="legend"><span><i class="c-up"></i>这天充电多</span><span><i class="c-down"></i>这天耗电多</span><span><i class="c-ans"></i>持平或只写了回答</span><span><i class="ring"></i>有心事</span></div>
    <div class="road" id="road"></div>
  </div>`, animate);
  const road = $("road");
  const W = road.clientWidth, gap = 124, top = 34;
  const pts = list.map((_, i) => [W / 2 + Math.sin(i * 0.95 + 0.5) * W * 0.27, top + i * gap]);
  const H = top + (list.length - 1) * gap + 60;
  const TONE = { up: "var(--warm)", down: "var(--cool)", calm: "var(--accent)" };
  const segs = [];
  let d = `M${pts[0][0]} ${pts[0][1] - 30} L${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c = ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6}, ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6}, ${p2[0]} ${p2[1]}`;
    d += c;
    const s = list[i].kind === "here" ? list[i].stop : list[i];
    if (s && s.kind === "day" && s.day) segs.push(`<path d="M${p1[0]} ${p1[1]}${c}" fill="none" stroke="${TONE[stopTone(s)]}" stroke-width="5" stroke-linecap="round" opacity=".45"/>`);
  }
  road.style.height = H + "px";
  road.innerHTML = `
    <svg width="${W}" height="${H}" aria-hidden="true">
      <path class="road-bed" d="${d}" fill="none" stroke="var(--road)" stroke-width="16" stroke-linecap="round"/>
      ${segs.join("")}
      <path class="road-line" d="${d}" fill="none" stroke="var(--road-line)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9"/>
    </svg>
    ${list.map((s, i) => {
      const [x, y] = pts[i], right = x < W / 2;
      const lw = right ? W - x - 26 : x - 26;
      const pos = right ? `left:${x + 22}px` : `right:${W - x + 22}px`;
      let node, title, body = "";
      if (s.kind === "here") {
        node = `<span class="rnode here${s.stop && s.stop.day ? " tone-" + stopTone(s.stop) : ""}${s.stop && s.stop.worries.length ? " has-worry" : ""}"></span>`;
        title = `今天 · 你在这里`;
        body = s.stop ? stopSnippet(s.stop) : "今天还没有记录";
      } else if (s.kind === "start") {
        node = `<span class="rnode start">${ICON_FLAG}</span>`;
        title = `出发 · ${md(s.date)}`;
        body = "一切从这里开始";
      } else if (s.kind === "week") {
        node = `<span class="rnode week">${ICON_FLAG}</span>`;
        title = `${md(s.week.start)} 那一周的复盘`;
        body = stopSnippet(s);
      } else {
        node = `<span class="rnode tone-${stopTone(s)}${s.worries.length ? " has-worry" : ""}"></span>`;
        title = `${md(s.date)}${s.step ? " · 第 " + s.step + " 步" : ""}`;
        body = stopSnippet(s);
      }
      const clickable = s.kind !== "start" && !(s.kind === "here" && !s.stop);
      return `<button class="rstop" type="button" style="top:${y}px;left:${x}px" ${clickable ? `data-stop="${i}"` : "disabled"} aria-label="${esc(title)}">${node}</button>
        <div class="rlabel ${right ? "r" : "l"}" style="top:${y}px;${pos};width:${Math.max(90, lw)}px">
          <span class="rt">${esc(title)}</span>${body ? `<span class="rb">${esc(body)}</span>` : ""}${energyLine(s.kind === "here" ? s.stop : s)}
        </div>`;
    }).join("")}`;
  if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const bed = road.querySelector(".road-bed"), len = bed.getTotalLength();
    bed.style.strokeDasharray = len; bed.style.strokeDashoffset = len;
    requestAnimationFrame(() => { bed.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)"; bed.style.strokeDashoffset = 0; });
    road.querySelectorAll(".rstop, .rlabel").forEach((el, i) => { el.style.animationDelay = Math.min(i * 40, 600) + "ms"; el.classList.add("pop"); });
  }
  road.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => {
    const s = list[+b.dataset.stop];
    if (s.kind === "week") { ui.weekStart = s.week.start; ui.reviewMode = "week"; renderReview(true); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    openDaySheet(s.kind === "here" ? s.stop : s);
  });
  road.querySelectorAll(".rlabel").forEach((l, i) => { const b = road.querySelectorAll(".rstop")[i]; if (!b.disabled) { l.style.cursor = "pointer"; l.onclick = () => b.click(); } });
  bindSwitch();
}
const ICON_FLAG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4M6 4h10l-2 4 2 4H6"/></svg>`;
function openDaySheet(s) {
  const d = s.day;
  document.body.classList.add("locked");
  $("sheet-root").innerHTML = `
  <div class="sheet-wrap" id="sheet-wrap">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="day-title">
      <div class="bar"><span></span><span class="ttl" id="day-title">${md(s.date)} ${weekdayCN(s.date)}</span><span class="r"><button id="d-close" type="button">完成</button></span></div>
      <div class="scroll">
        <div class="section first"><div class="kicker">${s.step ? "第 " + s.step + " 步 · " : ""}${ago(s.date)}</div></div>
        ${d && d.answer && d.answer.trim() ? `<div class="section first"><h2>${esc(QUESTIONS[d.q])}</h2><p class="text">${esc(d.answer)}</p>
          ${(d.later || []).map(l => `<div class="field-group"><span class="hint">${md(l.date)} 再看</span><p class="text">${esc(l.text)}</p></div>`).join("")}</div>` : ""}
        ${d && (d.energy || []).length ? `<div class="section"><h2>那天的能量</h2><div class="chips">${d.energy.map(e => `<span class="tag ${e.kind}" style="padding-right:12px">${e.kind === "up" ? "↑" : "↓"} ${esc(e.text)}</span>`).join("")}</div></div>` : ""}
        ${s.worries.length ? `<div class="section"><h2>那天的心事</h2><div class="list">${s.worries.map(worryItem).join("")}</div></div>` : ""}
        ${s.letters.length ? `<div class="section"><h2>那天写的信</h2>${s.letters.map(l => `<p class="text">${l.openOn > TODAY ? `封存中，${ymdCN(l.openOn)} 开启` : esc(l.body)}</p>`).join("")}</div>` : ""}
      </div>
    </div>
  </div>`;
  $("d-close").onclick = closeSheet;
  $("sheet-wrap").addEventListener("click", e => { if (e.target.id === "sheet-wrap") closeSheet(); });
  $("sheet-root").querySelectorAll("[data-open]").forEach(b => b.onclick = () => { closeSheet(); openWorrySheet(b.dataset.open, () => renderReview()); });
}
function reviewSwitch() {
  return `<div class="seg plain" role="group" aria-label="回顾方式" style="align-self:flex-start">
    <button type="button" data-mode="road" aria-pressed="${ui.reviewMode === "road"}">一路走来</button>
    <button type="button" data-mode="week" aria-pressed="${ui.reviewMode === "week"}">本周复盘</button></div>`;
}
function bindSwitch() {
  view.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { if (ui.reviewMode !== b.dataset.mode) { ui.reviewMode = b.dataset.mode; renderReview(true); } });
}
function renderReview(animate) { return ui.reviewMode === "week" ? renderWeek(animate) : renderRoad(animate); }
window.addEventListener("resize", () => {
  clearTimeout(roadResize);
  roadResize = setTimeout(() => { if (ui.tab === "review" && ui.reviewMode === "road" && !$("sheet-wrap")) renderRoad(false); }, 200);
});

/* ---------- 来信 ---------- */
function addMonths(dateStr, m) { const d = parseDate(dateStr); d.setMonth(d.getMonth() + m); return ymd(d); }
const ymdCN = s => s.slice(0, 4) + "年" + md(s);
function renderLetter(animate) {
  const letters = store.list("letter").sort((a, b) => a.openOn.localeCompare(b.openOn));
  const open = letters.filter(l => l.openOn <= TODAY), sealed = letters.filter(l => l.openOn > TODAY);
  paint(`
  <div class="section first">
    <div><div class="kicker">写给以后的自己</div><h1>现在的困惑，过一阵子再读会是什么感觉？</h1></div>
    <textarea class="write" id="l-body" placeholder="写写你现在在纠结什么、害怕什么、期待什么。"></textarea>
    <div class="row between">
      <select class="field" id="l-when" aria-label="多久后打开"><option value="1">1 个月后打开</option><option value="3">3 个月后打开</option><option value="6" selected>半年后打开</option><option value="12">1 年后打开</option></select>
      <button class="btn primary" id="l-save" type="button">封存</button>
    </div>
    <p class="hint" id="save-status">${whereText()}</p>
  </div>
  ${sealed.length ? `<div class="section"><div class="head-row"><h2>还在路上的信</h2><span class="hint">${sealed.length} 封</span></div><div class="list">${sealed.map(l => `
    <div class="item"><i class="dot c-faint"></i><span class="main"><span class="t">${ymdCN(l.openOn)} 开启</span><span class="s">写于 ${md(l.date)}</span></span><span class="v">还有 ${dayNumber(l.openOn) - dayNumber(TODAY)} 天</span></div>`).join("")}</div></div>` : ""}
  ${open.length ? `<div class="section"><div class="head-row"><h2>可以拆开的信</h2><span class="hint">${open.length} 封</span></div><div class="list">${open.map(l => `
    <button class="item" type="button" data-toggle="${esc(l.id)}"><i class="dot c-ans"></i><span class="main"><span class="t">写于 ${ymdCN(l.date)}</span>${ui.open[l.id] ? "" : `<span class="s">${esc(l.body)}</span>`}</span><span class="chev">${ui.open[l.id] ? "⌃" : "›"}</span></button>
    ${ui.open[l.id] ? `<div class="field-group" style="padding-bottom:12px"><p class="text">${esc(l.body)}</p><button class="btn link danger" type="button" data-del="${esc(l.id)}" style="align-self:flex-start">删除这封信</button></div>` : ""}`).join("")}</div></div>` : ""}
  ${!letters.length ? `<div class="section"><p class="hint">还没有信。写一封，半年后的你会收到。</p></div>` : ""}`, animate);
  grow($("l-body"));
  $("l-save").onclick = () => {
    const body = $("l-body").value.trim();
    if (!body) { $("l-body").focus(); return; }
    const at = Date.now();
    put("l-" + at, { type: "letter", at, date: TODAY, body, openOn: addMonths(TODAY, +$("l-when").value) }).catch(() => {});
    renderLetter();
  };
  view.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { ui.open[b.dataset.toggle] = !ui.open[b.dataset.toggle]; renderLetter(); });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => arm(b, "再点一次删除", () => { store.remove(b.dataset.del).catch(() => {}); renderLetter(); }));
}

/* ---------- shell ---------- */
const TABS = [["today", "今天", renderToday], ["worry", "心事", renderWorry], ["review", "回顾", renderReview], ["letter", "来信", renderLetter]];
$("tabs").innerHTML = TABS.map(([k, label]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="false">${ICON[k]}<span>${label}</span></button>`).join("");
function show(t) {
  const entry = TABS.find(x => x[0] === t) || TABS[0];
  ui.tab = entry[0];
  try { sessionStorage.setItem("seekway-tab", ui.tab); } catch (e) {}
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  entry[2](true);
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === ui.tab) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  show(b.dataset.tab); window.scrollTo(0, 0);
});
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderHero()); } catch (e) {}

if (window.claude && window.claude.use) {
  window.claude.use("sample").then(fn => {
    sampleFn = fn;
    const row = $("mirror-row"); if (fn && row) row.hidden = false;
  }).catch(() => {});
}
/* ---------- phone fit: no zooming, and the cover opens up when pulled down ---------- */
(function lockZoom() {
  let m = document.querySelector('meta[name="viewport"]');
  if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
  m.content = "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover";
  ["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
const HERO_BASE = 250;
let heroOpen = false, photoAspect = 0;
function heroFull() {
  const w = $("hero").clientWidth, st = settings();
  const natural = st.cover === "photo" && st.photo && photoAspect ? w / photoAspect : w * 400 / 390;
  return Math.max(HERO_BASE + 60, Math.min(natural, window.innerHeight * 0.8));
}
function setHero(h, animate) {
  const el = $("hero");
  el.classList.toggle("dragging", !animate);
  el.style.height = Math.round(h) + "px";
  el.classList.toggle("open", h > HERO_BASE + 30);
}
function toggleHero(open) { heroOpen = open; setHero(open ? heroFull() : HERO_BASE, true); }
(function pullToOpen() {
  let y0 = null, dy = 0;
  const blocked = t => $("sheet-wrap") || (t && t.closest && t.closest("textarea, input, select, button, .tabbar"));
  window.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || window.scrollY > 0 || blocked(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  window.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (window.scrollY > 0 || (dy < 0 && !heroOpen)) { y0 = null; setHero(heroOpen ? heroFull() : HERO_BASE, true); return; }
    e.preventDefault();
    const base = heroOpen ? heroFull() : HERO_BASE;
    const pull = dy > 0 ? Math.min(dy * 0.6, heroFull() + 40 - base) : dy;
    setHero(Math.max(HERO_BASE, base + pull), false);
  }, { passive: false });
  window.addEventListener("touchend", () => {
    if (y0 === null) return;
    y0 = null;
    if (!heroOpen && dy > 70) toggleHero(true);
    else if (heroOpen && dy < -50) toggleHero(false);
    else toggleHero(heroOpen);
  });
  $("hero").addEventListener("click", e => { if (!e.target.closest("button")) toggleHero(!heroOpen); });
  window.addEventListener("resize", () => setHero(heroOpen ? heroFull() : HERO_BASE, false));
})();
renderHero();
store.init().then(() => { renderHero(); show(ui.tab); });
</script>
