<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seekway">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8ebe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161916" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seekway</title>
<style>
/* Layout: each tab is a small stack of letter paper; swipe sideways to turn pages. Small type, sage-grey desk, white sheets, a postmark date. */
:root {
  --desk: #e8ebe6;
  --paper: #ffffff;
  --paper-2: #fafaf7;
  --paper-3: #f3f4f0;
  --ink: #2e332d;
  --ink-2: #5e665b;
  --muted: #8d978a;
  --faint: #b6bdb2;
  --rule: #e6e9e3;
  --line: #eef0eb;
  --accent: #56704f;
  --up: #b0844a;
  --up-soft: #f5eee2;
  --down: #6f8496;
  --down-soft: #eaeff3;
  --rose: #b4707e;
  --rose-soft: #f6ecee;
  --shadow: 0 14px 32px -18px rgba(30, 50, 30, .38), 0 2px 6px rgba(30, 50, 30, .05);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #161916; --paper: #232722; --paper-2: #1f231e; --paper-3: #1b1f1a;
    --ink: #e5e9e2; --ink-2: #b9c0b5; --muted: #8b9488; --faint: #5d655a; --rule: #333a32; --line: #2b312a;
    --accent: #9fbb96; --up: #d6ad74; --up-soft: #3a3122; --down: #9fb4c6; --down-soft: #25303a; --rose: #d899a6; --rose-soft: #3b2a2e;
    --shadow: 0 14px 32px -18px rgba(0, 0, 0, .8), 0 2px 6px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #161916; --paper: #232722; --paper-2: #1f231e; --paper-3: #1b1f1a;
  --ink: #e5e9e2; --ink-2: #b9c0b5; --muted: #8b9488; --faint: #5d655a; --rule: #333a32; --line: #2b312a;
  --accent: #9fbb96; --up: #d6ad74; --up-soft: #3a3122; --down: #9fb4c6; --down-soft: #25303a; --rose: #d899a6; --rose-soft: #3b2a2e;
  --shadow: 0 14px 32px -18px rgba(0, 0, 0, .8), 0 2px 6px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--desk); }
body { background: var(--desk); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }
.app { max-width: 520px; margin: 0 auto; padding-inline: 18px; padding-block: 18px calc(90px + env(safe-area-inset-bottom, 0px)); }

/* header row */
.head { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px 0; font-size: 12px; color: var(--muted); }
.head .name { color: var(--ink); font-weight: 600; font-size: 13px; letter-spacing: .02em; }
.head .pg { font-variant-numeric: tabular-nums; letter-spacing: .04em; }

/* the paper stack */
.stack { position: relative; padding-top: 22px; margin-top: 12px; }
.ghost { position: absolute; height: 80px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, .04); }
.ghost.g2 { top: 0; left: 20px; right: 20px; background: var(--paper-3); }
.ghost.g1 { top: 10px; left: 10px; right: 10px; background: var(--paper-2); }
.pages { position: relative; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; align-items: flex-start; margin-inline: -18px; padding-inline: 18px; scroll-padding-inline: 18px; overscroll-behavior-x: contain; }
.pages::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; min-width: 0; }
.paper { position: relative; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 22px 18px; min-height: 440px; display: flex; flex-direction: column; gap: 14px; }
.paper .grow { flex: 1; }
.pnav { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); padding-top: 8px; }
.pnav button { border: 0; background: none; padding: 6px 0; cursor: pointer; color: var(--muted); }
.pnav button:hover { color: var(--ink); }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); transition: width .25s, background .25s; }
.dots i.on { width: 14px; border-radius: 3px; background: var(--ink-2); }

/* stamp */
.stamp { position: absolute; right: 18px; top: 18px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--faint); color: var(--muted); display: grid; place-items: center; text-align: center; font-size: 10px; line-height: 1.25; letter-spacing: .04em; transform: rotate(-8deg); font-variant-numeric: tabular-nums; }
.stamp::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px dashed var(--rule); }

/* type */
.label { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
.q { font-size: 15px; font-weight: 600; line-height: 1.7; margin: 0; padding-right: 56px; }
.t15 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.6; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.quote { margin: 0; padding-left: 12px; border-left: 2px solid var(--rose-soft); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ruled writing */
textarea.ruled { display: block; width: 100%; border: 0; resize: none; font: inherit; font-size: 14px; color: var(--ink-2); line-height: 28px; padding: 0; min-height: 168px; background-color: transparent; background-image: linear-gradient(transparent 27px, var(--rule) 27px); background-size: 100% 28px; background-attachment: local; overflow: hidden; }
textarea.ruled.short { min-height: 84px; }
textarea.ruled:focus, input.inp:focus { outline: none; }
textarea::placeholder, input::placeholder { color: var(--faint); }
input.inp { width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); font: inherit; font-size: 14px; padding: 6px 0; }
input.inp:focus { border-bottom-color: var(--ink-2); }
select.sel { border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); font: inherit; font-size: 14px; padding: 6px 0; }

/* controls */
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.btn { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; color: var(--ink); transition: transform .12s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.text { border: 0; padding: 4px 0; color: var(--muted); font-size: 12px; }
.btn.text.accent { color: var(--accent); }
.btn.text.danger { color: var(--rose); }
.btn[disabled] { opacity: .45; }
.pick { display: inline-flex; gap: 6px; }
.pick button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--muted); }
.pick button[aria-pressed="true"][data-kind="up"] { background: var(--up-soft); border-color: transparent; color: var(--up); }
.pick button[aria-pressed="true"][data-kind="down"] { background: var(--down-soft); border-color: transparent; color: var(--down); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; color: var(--ink-2); transition: background .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* lists on paper */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border: 0; border-top: 1px dashed var(--rule); background: none; width: 100%; text-align: left; cursor: default; }
button.item { cursor: pointer; }
button.item:active { opacity: .6; }
.item:first-child { border-top: 0; }
.item .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 8px; flex: none; }
.item .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item .main .s { font-size: 12px; color: var(--muted); }
.item .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .v { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .chev { color: var(--faint); }
.x { border: 0; background: none; color: var(--faint); cursor: pointer; padding: 0 2px; font-size: 14px; }

/* review */
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wd .l { font-size: 10px; color: var(--muted); }
.wd .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.wd.today .n { background: var(--ink); color: var(--paper); }
.wd.future { opacity: .35; }
.marks { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 22px; min-height: 5px; }
.marks i { width: 5px; height: 5px; border-radius: 50%; }
.c-ans { background: var(--accent); } .c-up { background: var(--up); } .c-down { background: var(--down); } .c-worry { background: var(--rose); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 5px; height: 5px; border-radius: 50%; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; }
.grid4 > div { padding: 12px 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid4 > div:nth-child(odd) { padding-right: 12px; border-right: 1px dashed var(--rule); }
.grid4 > div:nth-child(even) { padding-left: 12px; }
.grid4 > div:nth-child(n+3) { border-top: 1px dashed var(--rule); }
.ranks { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.ranks li { display: flex; justify-content: space-between; gap: 6px; }
.ranks li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranks li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.weeknav { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.weeknav button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 0; font-size: 12px; }
.weeknav button[disabled] { opacity: .3; cursor: default; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--desk) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; padding: 12px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); cursor: pointer; font-size: 10px; letter-spacing: .06em; }
.tabbar svg { width: 21px; height: 21px; }
.tabbar button[aria-selected="true"] { color: var(--ink); }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; background: rgba(20, 30, 20, .28); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; height: calc(100% - 28px - env(safe-area-inset-top, 0px)); background: var(--paper); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px -10px rgba(0, 0, 0, .25); }
.sheet .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 20px 10px; font-size: 13px; }
.sheet .bar .ttl { font-weight: 600; }
.sheet .bar .r { justify-self: end; }
.sheet .bar button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
.sheet .bar .r button { color: var(--accent); font-weight: 600; }
.sheet .scroll { overflow-y: auto; padding: 6px 22px calc(30px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 22px; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; }
.step .n { font-size: 11px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.step .b { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.split { display: grid; grid-template-columns: 1fr; gap: 12px; }

@media (prefers-reduced-motion: no-preference) {
  .stack.enter .paper { animation: lift .42s cubic-bezier(.2, .8, .2, 1) both; }
  .stack.enter .ghost { animation: fade .5s ease-out both; }
  @keyframes lift { from { transform: translateY(14px) scale(.985); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } }
  .sheet-wrap { animation: fade .25s ease-out; }
  .sheet { animation: up .38s cubic-bezier(.2, .9, .25, 1); }
  @keyframes up { from { transform: translateY(100%); } }
  .pages { scroll-behavior: smooth; }
}
</style>

<div class="app"><main id="view"></main></div>
<nav class="tabbar" aria-label="页面"><div class="in" role="tablist" id="tabs"></div></nav>
<div id="sheet-root"></div>

<script>
const QUESTIONS = [
  "今天什么时候，你觉得时间过得最快？",
  "今天哪一刻，你在假装？",
  "如果明天不用为钱工作，你早上醒来会先做什么？",
  "最近一次忘了看手机，你在做什么？",
  "你羡慕谁？羡慕的到底是什么？",
  "小时候的你，会怎么看现在的你？",
  "今天有哪件事，做完之后你觉得没白过？",
  "你最近在逃避什么？",
  "有什么事，即使没人夸你，你也愿意一直做？",
  "你最近一次推翻自己，推翻的是什么？",
  "如果只剩一年，你会继续现在的工作吗？会改掉哪一部分？",
  "今天最消耗你的，是事情本身，还是你对它的想法？",
  "你希望别人怎样记住你？",
  "你身上有哪一点，是以前讨厌、现在开始接受的？",
  "你在什么时候最像你自己？",
  "如果失败没有任何代价，你想试什么？",
  "你现在的面包，除了钱，还给了你什么？",
  "今天你对自己说过最苛刻的一句话是什么？如果朋友这样说自己，你会怎么回？",
  "最近有什么让你好奇，想多了解一点？",
  "你在为谁的期待而活？",
  "你心里的“成功”，最早是从哪里学来的？",
  "今天你帮到了谁，哪怕一点点？",
  "有什么事，你一直说“等以后再说”？",
  "你害怕的那个最坏结果，真的发生了会怎样？",
  "过去一年里，你最骄傲的一个小选择是什么？",
  "哪个话题能让你一口气聊一小时？",
  "如果把你的一天拍成纪录片，哪一段你愿意重看？",
  "你最近一次感到平静是什么时候？",
  "你在等谁的允许？你可以自己给自己吗？",
  "你的热爱也许是一种状态，而不是一件事。那种状态是什么样的？",
  "今天有什么值得感谢的小事？",
  "有什么你曾经确信、现在不再确定的事？",
  "你想对一年后的自己说什么？",
  "你最常用“应该”来要求自己的是哪件事？",
  "如果要你教别人一样东西，你会教什么？",
  "今天你在哪里看到了美？",
  "你现在最大的矛盾是什么？两边各在守护什么？",
  "不考虑别人的眼光，你理想中的普通一天是什么样的？",
  "你真正不愿意放弃的东西是什么？",
  "今天有没有一个瞬间，你想停下来多待一会儿？"
];
const FEELINGS = ["生气", "委屈", "失望", "焦虑", "无力", "被忽视", "难过", "烦躁", "羞愧", "嫉妒"];
const NEEDS = ["被尊重", "被认可", "被理解", "被看见", "公平", "自主", "安全感", "被信任", "边界", "归属"];
const WEEKDAYS = "一二三四五六日";
const WD_EN = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  today: svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'),
  worry: svg('<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6 11.3 3.4 3.4 0 0 0 7 18z"/>'),
  review: svg('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  letter: svg('<rect x="3.5" y="6" width="17" height="12" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/>')
};

/* ---------- dates & helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const TODAY = ymd(new Date());
const dayNumber = s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const md = s => +s.slice(5, 7) + "月" + +s.slice(8, 10) + "日";
const ago = s => { const n = dayNumber(TODAY) - dayNumber(s); return n === 0 ? "今天" : n === 1 ? "昨天" : n + " 天前"; };
const wdIndex = s => (parseDate(s).getDay() + 6) % 7;
const stamp = s => `<span class="stamp" aria-hidden="true">${s.slice(5, 7)}.${s.slice(8, 10)}<br>${WD_EN[wdIndex(s)]}</span>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* ---------- storage: the viewer's private db subtree when available, this browser otherwise ---------- */
const LOCAL_KEY = "xunjing-v1";
const store = {
  mode: "local", db: null, uid: null, docs: {}, queues: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) {
          const snap = await db.collection("data/users/" + id).limit(1000).get();
          this.db = db; this.uid = id; this.mode = "cloud";
          snap.docs.forEach(d => { this.docs[d.id] = { ...d.data() }; });
          return;
        }
      }
    } catch (e) { /* fall back to this browser */ }
    try { this.docs = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch (e) { this.docs = {}; }
  },
  saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.docs)); } catch (e) {} },
  ref(id) { return this.db.collection("data/users/" + this.uid).doc(id); },
  enqueue(id, fn) { // one write at a time per document
    const next = (this.queues[id] || Promise.resolve()).catch(() => {}).then(fn);
    this.queues[id] = next;
    return next;
  },
  put(id, data) {
    this.docs[id] = data;
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    const body = JSON.parse(JSON.stringify(data));
    return this.enqueue(id, () => this.ref(id).set(body));
  },
  remove(id) {
    delete this.docs[id];
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    return this.enqueue(id, () => this.ref(id).delete());
  },
  list(type) { return Object.entries(this.docs).filter(([, d]) => d.type === type).map(([id, d]) => ({ id, ...d })); }
};
const whereText = () => store.mode === "cloud" ? "只有你能看到" : "保存在此浏览器";

function autogrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

function bindAutosave(el, save) {

  el.addEventListener("input", () => { autogrow(el); clearTimeout(t); t = setTimeout(flush, 900); });

}

function renderStack(title, pages, animate) {
  const idx = Math.min(ui.page[ui.tab] || 0, pages.length - 1);
  view.innerHTML = `
  <div class="head"><span class="name">${title}</span><span class="pg" id="pg">${idx + 1} / ${pages.length}</span></div>
  <div class="stack${animate ? " enter" : ""}">
    <div class="ghost g2"></div><div class="ghost g1"></div>
    <div class="pages" id="pages">${pages.map((p, i) => `
      <article class="page" aria-label="${esc(p.name)}"><div class="paper">${p.html}
        <div class="grow"></div>
        <div class="pnav">${i > 0 ? `<button type="button" data-go="${i - 1}">← ${esc(pages[i - 1].name)}</button>` : "<span></span>"}${i < pages.length - 1 ? `<button type="button" data-go="${i + 1}">${esc(pages[i + 1].name)} →</button>` : "<span></span>"}</div>
      </div></article>`).join("")}</div>
  </div>
  <div class="dots" id="dots">${pages.map((_, i) => `<i class="${i === idx ? "on" : ""}"></i>`).join("")}</div>`;
  const sc = $("pages");
  const w = () => sc.clientWidth + 14;
  sc.style.scrollBehavior = "auto"; sc.scrollLeft = idx * w(); sc.style.scrollBehavior = "";
  let raf;
  sc.addEventListener("scroll", () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = Math.round(sc.scrollLeft / w());
      if (i === ui.page[ui.tab]) return;

      $("pg").textContent = (i + 1) + " / " + pages.length;
      [...$("dots").children].forEach((d, j) => d.classList.toggle("on", j === i));

  }, { passive: true });
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => sc.scrollTo({ left: +b.dataset.go * w() }));
  ui.page[ui.tab] = idx;
}

function countTop(list, n) {
  const c = {};
  list.forEach(x => { const k = String(x).trim(); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n);
}
function weekData(start) {
  const dates = [...Array(7)].map((_, i) => addDays(start, i));
  const days = dates.map(d => store.docs["d-" + d]).filter(Boolean);
  const ws = worries().filter(w => w.date >= start && w.date <= dates[6]);
  return { dates, days, ws };
}
function pickReread() {
  const cands = [
    ...store.list("day").filter(d => d.answer && d.answer.trim()).map(d => ({ id: "d-" + d.date, doc: d })),
    ...worries().map(w => ({ id: w.id, doc: w }))
  ].filter(c => dayNumber(c.doc.date) <= dayNumber(TODAY) - 7);
  const doneToday = cands.find(c => (c.doc.later || []).some(l => l.date === TODAY));
  if (doneToday) return { ...doneToday, done: true };
  const fresh = cands.filter(c => !(c.doc.later || []).length).sort((a, b) => a.doc.date.localeCompare(b.doc.date));
  return fresh.length ? fresh[dayNumber(TODAY) % fresh.length] : null;
}
function weekMaterial(start) {
  const { dates, ws } = weekData(start);
  const lines = [];
  dates.forEach(date => {
    const d = store.docs["d-" + date]; if (!hasDay(d)) return;
    lines.push(`【${md(date)}】`);
    if (d.answer && d.answer.trim()) lines.push(`问：${QUESTIONS[d.q]}\n答：${d.answer.trim().slice(0, 600)}`);
    (d.energy || []).forEach(e => lines.push((e.kind === "up" ? "充电：" : "耗电：") + e.text));
  });
  ws.forEach(w => {
    lines.push(`【心事 · ${md(w.date)}${w.who ? " · 和" + w.who + "有关" : ""}】`);
    lines.push("倒出来的话：" + w.vent.slice(0, 500));
    if (w.fact) lines.push("事实：" + w.fact);
    if ((w.feelings || []).length) lines.push("感受：" + w.feelings.join("、"));
    if ((w.needs || []).length) lines.push("碰到的需要：" + w.needs.join("、"));
    if (w.mine) lines.push("在我手里的：" + w.mine);
    if (w.notMine) lines.push("不在我手里的：" + w.notMine);
  });
  return lines.join("\n");
}

      <div class="row between" id="mirror-row" ${sampleFn && anything ? "" : "hidden"}>
        <span class="note" id="mirror-status"></span>
        <span class="row"><button class="btn text" id="mirror-stop" type="button" hidden>停止</button><button class="btn" id="mirror" type="button">${wk.ai ? "重新看一次" : "请它看看"}</button></span>
      </div>
      ${!anything ? `<p class="note">这一周还没有记录，先写几天再来。</p>` : ""}` },
    { name: "写给这一周", html: `
      <span class="label">写给这一周</span>
      <div><span class="t15">这周我最真实的一刻</span><textarea class="ruled short" id="r-moment" placeholder="哪一刻你没有在假装？">${esc(wk.moment)}</textarea></div>
      <div><span class="t15">我注意到的一个重复</span><textarea class="ruled short" id="r-pattern" placeholder="同样的感受、同样的人、同样的情境">${esc(wk.pattern)}</textarea></div>
      <div><span class="t15">下周我想对自己说</span><textarea class="ruled short" id="r-note" placeholder="一句就够">${esc(wk.note)}</textarea></div>
      <span class="note" id="save-status">${whereText()}</span>` },
    { name: "重读", html: rr ? `
      ${stamp(rr.doc.date)}
      <span class="label">重读 · ${ago(rr.doc.date)}</span>
      ${rr.doc.type === "worry" ? `<p class="q">那时的一件心事</p><p class="quote">${esc(rr.doc.vent)}</p>` : `<p class="q">${esc(QUESTIONS[rr.doc.q])}</p><p class="quote">${esc(rr.doc.answer)}</p>`}
      ${rr.done ? `<p class="body">${esc(rr.doc.later.find(l => l.date === TODAY).text)}</p><p class="note">过去的你和现在的你，今天见了一面。</p>`
        : `<textarea class="ruled short" id="rr-text" placeholder="现在再看，你怎么想？"></textarea><div class="row end"><button class="btn ink" id="rr-save" type="button">写下现在的想法</button></div>`}
      ${heavy.length ? `<span class="label" style="margin-top:12px">还压在心上的 · ${heavy.length}</span><div class="list">${heavy.slice(0, 4).map(worryItem).join("")}</div>` : ""}`
      : `<span class="label">重读</span><p class="q" style="padding-right:0">一周以后，这里会出现你以前写下的话。</p><p class="note">到时候再看看那时的自己。</p>
      ${heavy.length ? `<span class="label" style="margin-top:12px">还压在心上的 · ${heavy.length}</span><div class="list">${heavy.slice(0, 4).map(worryItem).join("")}</div>` : ""}` },
    ...(pastWeeks.length ? [{ name: "以前的周", html: `
      <span class="label">以前写给自己的</span>
      <div class="list">${pastWeeks.map(w => `<div class="item"><span class="main" style="gap:4px">
        <span class="s">${md(w.start)} – ${md(addDays(w.start, 6))}</span>
        ${w.moment ? `<p class="body"><span class="note">最真实的一刻　</span>${esc(w.moment)}</p>` : ""}
        ${w.pattern ? `<p class="body"><span class="note">一个重复　</span>${esc(w.pattern)}</p>` : ""}
        ${w.note ? `<p class="body"><span class="note">对自己说　</span>${esc(w.note)}</p>` : ""}
      </span></div>`).join("")}</div>` }] : [])
  ];
  renderStack("回顾", pages, animate);

  $("prev").onclick = () => { ui.weekStart = addDays(ui.weekStart, -7); renderReview(); };
  $("next").onclick = () => { if (!isThisWeek) { ui.weekStart = addDays(ui.weekStart, 7); renderReview(); } };
  [["r-moment", "moment"], ["r-pattern", "pattern"], ["r-note", "note"]].forEach(([elId, key]) => {
    bindAutosave($(elId), v => { const w = { ...weekDoc(start) }; w[key] = v; return put("w-" + start, w); });
  });
  if (rr && !rr.done) {
    const t = $("rr-text"); grow(t);
    $("rr-save").onclick = () => {
      const text = t.value.trim(); if (!text) { t.focus(); return; }
      const doc = { ...store.docs[rr.id] };
      doc.later = [...(doc.later || []), { date: TODAY, text }];
      put(rr.id, doc).catch(() => {});
      renderReview();
    };
  }
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openWorrySheet(b.dataset.open, () => renderReview()));

  const mBtn = $("mirror");
  if (mBtn) mBtn.onclick = async () => {
    const live = $("mirror-live"), stop = $("mirror-stop"), st = $("mirror-status");
    const ctl = new AbortController();
    mBtn.disabled = true; stop.hidden = false; live.hidden = false; live.textContent = "正在读这一周…"; st.textContent = "";
    stop.onclick = () => ctl.abort();
    try {
      const { text } = await sampleFn(MIRROR_RULES + weekMaterial(start), { cache: false, signal: ctl.signal, onText: ({ text }) => { live.textContent = text; } });
      put("w-" + start, { ...weekDoc(start), ai: text.trim() }).catch(() => {});
      if (ui.tab === "review") renderReview();
    } catch (e) {
      live.hidden = true; mBtn.disabled = false; stop.hidden = true;
      if (e && e.code === "not_granted") { sampleFn = null; st.textContent = "没有开启这个功能"; }
      else if (e && e.code === "rate_limited") st.textContent = "稍后再试";
      else if (!(e && e.code === "cancelled")) st.textContent = "这次没看成，稍后再试";
    }
  };
}

/* ---------- 来信 ---------- */
function addMonths(dateStr, m) { const d = parseDate(dateStr); d.setMonth(d.getMonth() + m); return ymd(d); }
const ymdCN = s => s.slice(0, 4) + "年" + md(s);
function renderLetter(animate) {
  const letters = store.list("letter").sort((a, b) => a.openOn.localeCompare(b.openOn));
  const open = letters.filter(l => l.openOn <= TODAY), sealed = letters.filter(l => l.openOn > TODAY);
  renderStack("来信", [
    { name: "写一封", html: `
      ${stamp(TODAY)}
      <span class="label">写给以后的自己</span>
      <p class="q">现在的困惑，过一阵子再读会是什么感觉？</p>
      <textarea class="ruled" id="l-body" placeholder="写写你现在在纠结什么、害怕什么、期待什么。"></textarea>
      <div class="row between">
        <select class="sel" id="l-when" aria-label="多久后打开"><option value="1">1 个月后打开</option><option value="3">3 个月后打开</option><option value="6" selected>半年后打开</option><option value="12">1 年后打开</option></select>
        <button class="btn ink" id="l-save" type="button">封存</button>
      </div>
      <span class="note" id="save-status">${whereText()}</span>` },
    { name: "信箱", html: `
      <span class="label">信箱 · ${letters.length}</span>
      ${sealed.length ? `<div class="list">${sealed.map(l => `
        <div class="item"><i class="dot" style="background:var(--faint)"></i><span class="main"><span>${ymdCN(l.openOn)} 开启</span><span class="s">写于 ${md(l.date)}</span></span><span class="v">还有 ${dayNumber(l.openOn) - dayNumber(TODAY)} 天</span></div>`).join("")}</div>` : ""}
      ${open.length ? `<div class="list">${open.map(l => `
        <button class="item" type="button" data-toggle="${esc(l.id)}"><i class="dot c-ans"></i><span class="main"><span>写于 ${ymdCN(l.date)}</span><span class="s ${ui.open[l.id] ? "" : "clip"}">${ui.open[l.id] ? "收起" : esc(l.body)}</span></span><span class="chev">${ui.open[l.id] ? "⌃" : "›"}</span></button>
        ${ui.open[l.id] ? `<div class="item" style="border-top:0;padding-top:0"><span class="main" style="gap:8px"><p class="body">${esc(l.body)}</p><span><button class="btn text danger" type="button" data-del="${esc(l.id)}">删除这封信</button></span></span></div>` : ""}`).join("")}</div>` : ""}
      ${!letters.length ? `<p class="note">还没有信。写一封，半年后的你会收到。</p>` : ""}` }
  ], animate);
  grow($("l-body"));
  $("l-save").onclick = () => {
    const body = $("l-body").value.trim();
    if (!body) { $("l-body").focus(); return; }
    const at = Date.now();
    put("l-" + at, { type: "letter", at, date: TODAY, body, openOn: addMonths(TODAY, +$("l-when").value) }).catch(() => {});
    goPage(1);
    renderLetter();
  };
  view.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => { ui.open[b.dataset.toggle] = !ui.open[b.dataset.toggle]; renderLetter(); });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => arm(b, "再点一次删除", () => { store.remove(b.dataset.del).catch(() => {}); renderLetter(); }));
}

/* ---------- shell ---------- */
const TABS = [["today", "今天", renderToday], ["worry", "心事", renderWorry], ["review", "回顾", renderReview], ["letter", "来信", renderLetter]];
$("tabs").innerHTML = TABS.map(([k, label]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="false" aria-label="${label}">${ICON[k]}<span>${label}</span></button>`).join("");
function show(t) {
  const entry = TABS.find(x => x[0] === t) || TABS[0];
  ui.tab = entry[0];
  try { sessionStorage.setItem("seekway-tab", ui.tab); } catch (e) {}
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  entry[2](true);
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === ui.tab) { ui.page[ui.tab] = 0; show(ui.tab); return; }
  show(b.dataset.tab); window.scrollTo(0, 0);
});

if (window.claude && window.claude.use) {
  window.claude.use("sample").then(fn => {
    sampleFn = fn;
    const row = $("mirror-row");
    if (fn && row && (weekData(ui.weekStart).days.some(hasDay) || weekData(ui.weekStart).ws.length)) row.hidden = false;
  }).catch(() => {});
}
view.innerHTML = `<div class="head"><span class="name">Seekway</span></div>`;
store.init().then(() => show(ui.tab));
</script>

</body>
</html>
