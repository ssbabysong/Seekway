<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seekway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: a quiet single column like a bound journal; big serif page titles; writing happens on borderless paper; a bottom tab bar like a native app. */
:root {
  --bg: #f3f3f0;
  --paper: #fbfbf9;
  --ink: #17191c;
  --muted: #6b6f74;
  --faint: #a2a5a9;
  --line: #e2e2dd;
  --accent: #2f3d63;
  --accent-soft: #e6e9f1;
  --up: #a2702a;
  --up-soft: #f2e9d8;
  --down: #5a6a83;
  --down-soft: #e4e8ee;
  --warm: #974a3b;
  --warm-soft: #f3e5e0;
  --font-brand: "Cormorant Garamond", "Times New Roman", serif;
  --font-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --paper: #16171a; --ink: #e8e8e5; --muted: #9a9ea3; --faint: #5f6368; --line: #26282c;
    --accent: #a9b6dd; --accent-soft: #1e2433; --up: #d8a75e; --up-soft: #2d2518; --down: #9fb0c9; --down-soft: #1d232d;
    --warm: #e09a88; --warm-soft: #33211d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1012; --paper: #16171a; --ink: #e8e8e5; --muted: #9a9ea3; --faint: #5f6368; --line: #26282c;
  --accent: #a9b6dd; --accent-soft: #1e2433; --up: #d8a75e; --up-soft: #2d2518; --down: #9fb0c9; --down-soft: #1d232d;
  --warm: #e09a88; --warm-soft: #33211d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.75; letter-spacing: .01em; -webkit-font-smoothing: antialiased; }
.app { max-width: 620px; margin: 0 auto; padding-inline: 20px; padding-block: 28px calc(110px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-size: .8rem; }
.brand { font-family: var(--font-brand); font-style: italic; font-size: 1.35rem; color: var(--ink); letter-spacing: .01em; }
.save-state { font-size: .75rem; color: var(--faint); }
main { display: flex; flex-direction: column; gap: 44px; margin-top: 28px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--font-serif); font-weight: 600; font-size: 2rem; line-height: 1.3; margin: 0; letter-spacing: .02em; }
h2 { font-family: var(--font-serif); font-weight: 600; font-size: 1.2rem; line-height: 1.5; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 34em; }
.eyebrow { font-size: .72rem; letter-spacing: .18em; color: var(--muted); }
.block { display: flex; flex-direction: column; gap: 14px; }
.hair { height: 1px; background: var(--line); border: 0; margin: 0; }

/* writing paper */
.question { font-family: var(--font-serif); font-weight: 500; font-size: 1.45rem; line-height: 1.6; margin: 0; text-wrap: balance; }
.write { width: 100%; border: 0; background: transparent; color: var(--ink); font-family: var(--font-serif); font-size: 1.06rem; line-height: 1.95; resize: none; padding: 0; min-height: 7.5em; overflow: hidden; }
.write::placeholder, input::placeholder { color: var(--faint); }
.write:focus { outline: none; }
.paper { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 12px; }
.paper .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.field { width: 100%; font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; }
.field:focus { outline: none; border-bottom-color: var(--accent); }
.small-field { flex: 1 1 160px; min-width: 0; }

/* buttons & chips */
.btn { font: inherit; font-size: .88rem; border-radius: 999px; padding: 8px 18px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.up { color: var(--up); border-color: transparent; background: var(--up-soft); }
.btn.down { color: var(--down); border-color: transparent; background: var(--down-soft); }
.btn.quiet { border: 0; padding: 4px 0; color: var(--muted); background: none; font-size: .82rem; }
.btn.quiet.danger { color: var(--warm); }
.btn[disabled] { opacity: .45; cursor: default; }
button:focus-visible, .field:focus-visible, .write:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.chip { font: inherit; font-size: .86rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 2px; font-size: .84rem; padding: 2px 4px 2px 12px; border-radius: 999px; }
.tag.up { background: var(--up-soft); color: var(--up); }
.tag.down { background: var(--down-soft); color: var(--down); }
.tag.need { background: var(--accent-soft); color: var(--accent); padding-right: 12px; }
.tag .x { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; opacity: .55; padding: 0 8px; }

/* lists & cards */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .meta { display: flex; justify-content: space-between; gap: 10px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.excerpt { font-family: var(--font-serif); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.full { font-family: var(--font-serif); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote { font-family: var(--font-serif); margin: 0; padding-left: 16px; border-left: 2px solid var(--warm-soft); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.list { display: flex; flex-direction: column; gap: 12px; }
.empty { color: var(--faint); font-size: .9rem; padding: 22px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }
details > summary { cursor: pointer; color: var(--muted); font-size: .88rem; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "＋ "; color: var(--faint); }
details[open] > summary::before { content: "－ "; }
details > .list { margin-top: 12px; }

/* worry steps */
.step { display: grid; grid-template-columns: 28px 1fr; gap: 4px 12px; }
.step .n { font-family: var(--font-brand); font-style: italic; font-size: 1.3rem; color: var(--faint); line-height: 1.4; }
.step .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.step .t { font-weight: 500; }
.step .h { color: var(--muted); font-size: .85rem; margin: -6px 0 0; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.box .write { min-height: 4.5em; font-size: 1rem; }

/* review */
.week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.week-nav .range { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .88rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border-radius: 12px; padding: 10px 2px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); min-height: 120px; }
.day.today { border-color: var(--ink); }
.day.future { opacity: .45; }
.day .wd { font-size: .72rem; color: var(--muted); }
.day .dn { font-family: var(--font-serif); font-weight: 600; font-variant-numeric: tabular-nums; }
.marks { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mark { width: 8px; height: 8px; border-radius: 50%; }
.mark.up { background: var(--up); } .mark.down { background: var(--down); }
.mark.worry { background: transparent; border: 1.5px solid var(--warm); }
.mark.ans { width: 14px; height: 2px; border-radius: 2px; background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .75rem; color: var(--muted); }
.legend .mark { display: inline-block; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.patterns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ranks li { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.ranks li span:first-child { overflow-wrap: anywhere; min-width: 0; }
.ranks li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.mirror { font-family: var(--font-serif); white-space: pre-wrap; margin: 0; color: var(--accent); line-height: 1.95; }
.ritual { display: flex; flex-direction: column; gap: 22px; }
.ritual label { font-family: var(--font-serif); font-weight: 500; }
.hint { color: var(--faint); font-size: .82rem; margin: 0; }

/* bottom tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
nav.tabs .inner { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { font: inherit; font-size: .86rem; background: none; border: 0; padding: 8px 0 6px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: transparent; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; }
nav.tabs button[aria-selected="true"]::after { background: var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .35s ease-out both; }
  main > *:nth-child(2) { animation-delay: .04s; } main > *:nth-child(3) { animation-delay: .08s; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
@media (max-width: 440px) {
  h1 { font-size: 1.7rem; }
  .question { font-size: 1.28rem; }
  .paper { padding: 18px 16px 14px; }
  .patterns { grid-template-columns: 1fr; }
  .day { min-height: 104px; }
}
</style>

<div class="app">
  <div class="top"><span class="brand">Seekway</span><span class="save-state" id="where"></span></div>
  <main id="view"><div class="empty">正在打开你的本子…</div></main>
</div>
<nav class="tabs" aria-label="页面">
  <div class="inner" role="tablist">
    <button role="tab" id="tab-today" data-tab="today" aria-selected="true">今天</button>
    <button role="tab" id="tab-worry" data-tab="worry" aria-selected="false">心事</button>
    <button role="tab" id="tab-review" data-tab="review" aria-selected="false">回顾</button>
    <button role="tab" id="tab-letter" data-tab="letter" aria-selected="false">来信</button>
  </div>
</nav>

<script>
const QUESTIONS = [
  "今天什么时候，你觉得时间过得最快？",
  "今天哪一刻，你在假装？",
  "如果明天不用为钱工作，你早上醒来会先做什么？",
  "最近一次忘了看手机，你在做什么？",
  "你羡慕谁？羡慕的到底是什么？",
  "小时候的你，会怎么看现在的你？",
  "今天有哪件事，做完之后你觉得没白过？",
  "你最近在逃避什么？",
  "有什么事，即使没人夸你，你也愿意一直做？",
  "你最近一次推翻自己，推翻的是什么？",
  "如果只剩一年，你会继续现在的工作吗？会改掉哪一部分？",
  "今天最消耗你的，是事情本身，还是你对它的想法？",
  "你希望别人怎样记住你？",
  "你身上有哪一点，是以前讨厌、现在开始接受的？",
  "你在什么时候最像你自己？",
  "如果失败没有任何代价，你想试什么？",
  "你现在的面包，除了钱，还给了你什么？",
  "今天你对自己说过最苛刻的一句话是什么？如果朋友这样说自己，你会怎么回？",
  "最近有什么让你好奇，想多了解一点？",
  "你在为谁的期待而活？",
  "你心里的“成功”，最早是从哪里学来的？",
  "今天你帮到了谁，哪怕一点点？",
  "有什么事，你一直说“等以后再说”？",
  "你害怕的那个最坏结果，真的发生了会怎样？",
  "过去一年里，你最骄傲的一个小选择是什么？",
  "哪个话题能让你一口气聊一小时？",
  "如果把你的一天拍成纪录片，哪一段你愿意重看？",
  "你最近一次感到平静是什么时候？",
  "你在等谁的允许？你可以自己给自己吗？",
  "你的热爱也许是一种状态，而不是一件事。那种状态是什么样的？",
  "今天有什么值得感谢的小事？",
  "有什么你曾经确信、现在不再确定的事？",
  "你想对一年后的自己说什么？",
  "你最常用“应该”来要求自己的是哪件事？",
  "如果要你教别人一样东西，你会教什么？",
  "今天你在哪里看到了美？",
  "你现在最大的矛盾是什么？两边各在守护什么？",
  "不考虑别人的眼光，你理想中的普通一天是什么样的？",
  "你真正不愿意放弃的东西是什么？",
  "今天有没有一个瞬间，你想停下来多待一会儿？"
];
const FEELINGS = ["生气", "委屈", "失望", "焦虑", "无力", "被忽视", "难过", "烦躁", "羞愧", "嫉妒"];
const NEEDS = ["被尊重", "被认可", "被理解", "被看见", "公平", "自主", "安全感", "被信任", "边界", "归属"];
const WEEKDAYS = "一二三四五六日";

const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => { const d = parseDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const TODAY = ymd(new Date());
const dayNumber = s => Math.floor(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const md = s => +s.slice(5, 7) + "月" + +s.slice(8, 10) + "日";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

/* ---------- storage: the viewer's private db subtree when available, this browser otherwise ---------- */
const LOCAL_KEY = "xunjing-v1";
const store = {
  mode: "local", db: null, uid: null, docs: {}, queues: {},
  async init() {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) {
          const snap = await db.collection("data/users/" + id).limit(1000).get();
          this.db = db; this.uid = id; this.mode = "cloud";
          snap.docs.forEach(d => { this.docs[d.id] = { ...d.data() }; });
          return;
        }
      }
    } catch (e) { /* fall back to this browser */ }
    try { this.docs = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch (e) { this.docs = {}; }
  },
  saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.docs)); } catch (e) {} },
  ref(id) { return this.db.collection("data/users/" + this.uid).doc(id); },
  enqueue(id, fn) { // one write at a time per document
    const next = (this.queues[id] || Promise.resolve()).catch(() => {}).then(fn);
    this.queues[id] = next;
    return next;
  },
  put(id, data) {
    this.docs[id] = data;
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    const body = JSON.parse(JSON.stringify(data));
    return this.enqueue(id, () => this.ref(id).set(body));
  },
  remove(id) {
    delete this.docs[id];
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    return this.enqueue(id, () => this.ref(id).delete());
  },
  list(type) { return Object.entries(this.docs).filter(([, d]) => d.type === type).map(([id, d]) => ({ id, ...d })); }
};
const saveErr = e => e && e.code === "quota_exceeded" ? "空间满了，删掉一些旧记录再试" : "没保存上，稍后再试";
let flashTimer;
function flash(msg) {
  const el = $("where"); if (!el) return;
  el.textContent = msg; clearTimeout(flashTimer);
  if (msg === "已保存") flashTimer = setTimeout(() => { el.textContent = whereText(); }, 1800);
}
const whereText = () => store.mode === "cloud" ? "只有你能看到" : "仅保存在此浏览器";
function put(id, doc) {
  flash("保存中…");
  return store.put(id, doc).then(() => flash("已保存"), e => { flash(saveErr(e)); throw e; });
}

function dayDoc(date) {
  return store.docs["d-" + date] || { type: "day", date, q: dayNumber(date) % QUESTIONS.length, answer: "", energy: [] };
}
function weekDoc(start) {
  return store.docs["w-" + start] || { type: "week", start, moment: "", pattern: "", note: "", ai: "" };
}
const hasDay = d => !!(d && ((d.answer && d.answer.trim()) || (d.energy && d.energy.length)));

function autogrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
function bindAutosave(el, save) {
  let t, last = el.value;
  const flush = () => { clearTimeout(t); if (el.value === last) return; last = el.value; save(el.value).catch(() => {}); };
  el.addEventListener("input", () => { autogrow(el); clearTimeout(t); t = setTimeout(flush, 900); });
  el.addEventListener("blur", flush);
  requestAnimationFrame(() => autogrow(el));
  return flush;
}
function confirmDelete(btn, onYes) {
  if (btn.dataset.armed) { onYes(); return; }
  const label = btn.textContent;
  btn.dataset.armed = "1"; btn.textContent = "再点一次删除";
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; } }, 3000);
}

const ui = { tab: "today", worryId: null, weekStart: mondayOf(TODAY) };
try { ui.tab = sessionStorage.getItem("seekway-tab") || "today"; } catch (e) {}
const view = $("view");
let sampleFn = null;

/* ---------- 今天 ---------- */
function renderToday() {
  const day = dayDoc(TODAY);
  const energy = day.energy || [];
  const d = new Date();
  view.innerHTML = `
  <div class="page-head">
    <span class="eyebrow">${d.getFullYear()} · 星期${WEEKDAYS[(d.getDay() + 6) % 7]}</span>
    <h1>${md(TODAY)}</h1>
  </div>

  <div class="paper">
    <span class="eyebrow">今日一问</span>
    <p class="question">${esc(QUESTIONS[day.q])}</p>
    <textarea class="write" id="answer" placeholder="想到什么就写什么，不用写完整。">${esc(day.answer)}</textarea>
    <div class="foot"><button class="btn quiet" id="swap" type="button">换一个问题</button><span class="hint">自动保存</span></div>
  </div>

  <div class="block">
    <span class="eyebrow">能量</span>
    <h2>今天哪些事让你有劲，哪些让你消耗？</h2>
    <form class="row" id="energy-form">
      <input class="field small-field" type="text" id="energy-text" maxlength="40" placeholder="比如：和朋友聊项目" autocomplete="off">
      <button class="btn up" type="submit" data-kind="up">充电</button>
      <button class="btn down" type="submit" data-kind="down">耗电</button>
    </form>
    ${energy.length ? `<ul class="chips">${energy.map((e, i) =>

/* ---------- 回顾 ---------- */
function countTop(list, n) {
  const c = {};
  list.forEach(x => { const k = String(x).trim(); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n);
}
function weekData(start) {
  const dates = [...Array(7)].map((_, i) => addDays(start, i));
  const days = dates.map(d => store.docs["d-" + d]).filter(Boolean);
  const ws = worries().filter(w => w.date >= start && w.date <= dates[6]);
  return { dates, days, ws };
}
function pickReread() {
  // something written at least a week ago, not looked at again yet; one per day
  const cands = [
    ...store.list("day").filter(d => d.answer && d.answer.trim()).map(d => ({ id: "d-" + d.date, doc: d })),
    ...worries().map(w => ({ id: w.id, doc: w }))
  ].filter(c => dayNumber(c.doc.date) <= dayNumber(TODAY) - 7);
  const doneToday = cands.find(c => (c.doc.later || []).some(l => l.date === TODAY));
  if (doneToday) return { ...doneToday, done: true };
  const fresh = cands.filter(c => !(c.doc.later || []).length).sort((a, b) => a.doc.date.localeCompare(b.doc.date));
  if (!fresh.length) return null;
  return fresh[dayNumber(TODAY) % fresh.length];
}
function weekMaterial(start) {
  const { dates, ws } = weekData(start);
  const lines = [];
  dates.forEach(date => {
    const d = store.docs["d-" + date]; if (!hasDay(d)) return;
    lines.push(`【${md(date)}】`);
    if (d.answer && d.answer.trim()) lines.push(`问：${QUESTIONS[d.q]}\n答：${d.answer.trim().slice(0, 600)}`);
    (d.energy || []).forEach(e => lines.push((e.kind === "up" ? "充电：" : "耗电：") + e.text));
  });
  ws.forEach(w => {
    lines.push(`【心事 · ${md(w.date)}${w.who ? " · 和" + w.who + "有关" : ""}】`);
    lines.push("倒出来的话：" + w.vent.slice(0, 500));
    if (w.fact) lines.push("事实：" + w.fact);
    if ((w.feelings || []).length) lines.push("感受：" + w.feelings.join("、"));
    if ((w.needs || []).length) lines.push("碰到的需要：" + w.needs.join("、"));
    if (w.mine) lines.push("在我手里的：" + w.mine);
    if (w.notMine) lines.push("不在我手里的：" + w.notMine);
  });
  return lines.join("\n");
}

  });

  const mBtn = $("mirror");
  if (mBtn) mBtn.onclick = async () => {
    const live = $("mirror-live"), stop = $("mirror-stop"), st = $("mirror-status");
    const ctl = new AbortController();
    mBtn.disabled = true; stop.hidden = false; live.hidden = false; live.textContent = "正在读这一周…"; st.textContent = "";
    stop.onclick = () => ctl.abort();
    try {
      const { text } = await sampleFn(MIRROR_RULES + weekMaterial(start), { cache: false, signal: ctl.signal, onText: ({ text }) => { live.textContent = text; } });
      const w = { ...weekDoc(start), ai: text.trim() };
      put("w-" + start, w).catch(() => {});
      if (ui.tab === "review") renderReview();
    } catch (e) {
      live.hidden = true; mBtn.disabled = false; stop.hidden = true;
      if (e && e.code === "not_granted") { sampleFn = null; mBtn.hidden = true; st.textContent = "没有开启这个功能，其他部分照常可用。"; }
      else if (e && e.code === "rate_limited") st.textContent = "稍等一会儿再试。";
      else if (!(e && e.code === "cancelled")) st.textContent = "这次没看成，稍后再试。";
    }
  };
}

/* ---------- 来信 ---------- */
function addMonths(dateStr, m) {
  const d = parseDate(dateStr); d.setMonth(d.getMonth() + m); return ymd(d);
}
function renderLetter() {
  const letters = store.list("letter").sort((a, b) => a.openOn.localeCompare(b.openOn));
  const open = letters.filter(l => l.openOn <= TODAY), sealed = letters.filter(l => l.openOn > TODAY);
  view.innerHTML = `
  <div class="page-head">
    <span class="eyebrow">来信</span>
    <h1>写给以后的自己</h1>
    <p class="sub">把现在的困惑封存起来。过一阵子再读，你会看见自己走了多远。</p>
  </div>
  <div class="paper">
    <textarea class="write" id="l-body" placeholder="写写你现在在纠结什么、害怕什么、期待什么。"></textarea>
    <div class="foot">
      <select class="field small-field" id="l-when" style="flex:0 1 auto;width:auto" aria-label="多久后打开">
        <option value="1">1 个月后打开</option>
        <option value="3">3 个月后打开</option>
        <option value="6" selected>半年后打开</option>
        <option value="12">1 年后打开</option>
      </select>
      <button class="btn solid" id="l-save" type="button">封存</button>
    </div>
  </div>
  ${open.length ? `<div class="block"><span class="eyebrow">可以拆开的信</span><div class="list">${open.map(l => `
    <div class="card"><span class="meta"><span>写于 ${l.date.slice(0, 4)} 年 ${md(l.date)}</span><button class="btn quiet danger" data-del="${esc(l.id)}" type="button">删除</button></span><p class="full">${esc(l.body)}</p></div>`).join("")}</div></div>` : ""}
  ${sealed.length ? `<div class="block"><span class="eyebrow">还在路上的信</span><div class="list">${sealed.map(l => `
    <div class="card" style="background:var(--accent-soft);border-color:transparent"><span class="meta"><span>写于 ${md(l.date)}</span><span>还有 ${dayNumber(l.openOn) - dayNumber(TODAY)} 天</span></span><p style="margin:0;font-family:var(--font-serif)">${l.openOn.slice(0, 4)} 年 ${md(l.openOn)} 开启</p></div>`).join("")}</div></div>` : ""}
  ${!letters.length ? `<div class="empty">还没有信。写一封，半年后的你会收到。</div>` : ""}`;
  $("l-body").addEventListener("input", e => autogrow(e.target));
  $("l-save").onclick = () => {
    const body = $("l-body").value.trim();
    if (!body) { $("l-body").focus(); return; }
    const at = Date.now();
    put("l-" + at, { type: "letter", at, date: TODAY, body, openOn: addMonths(TODAY, +$("l-when").value) }).catch(() => {});
    renderLetter();
  };
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmDelete(b, () => { store.remove(b.dataset.del).catch(() => {}); renderLetter(); }));
}

/* ---------- shell ---------- */
const RENDER = { today: renderToday, worry: renderWorry, review: renderReview, letter: renderLetter };
function show(t) {
  ui.tab = RENDER[t] ? t : "today";
  try { sessionStorage.setItem("seekway-tab", ui.tab); } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  RENDER[ui.tab]();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === "worry" && ui.tab === "worry") ui.worryId = null;
  show(b.dataset.tab); window.scrollTo(0, 0);
});

if (window.claude && window.claude.use) {
  window.claude.use("sample").then(fn => {
    sampleFn = fn;
    const b = $("mirror"); if (fn && b) b.hidden = false;
  }).catch(() => {});
}
store.init().then(() => {
  $("where").textContent = whereText();
  show(ui.tab);
});
</script>

</body>
